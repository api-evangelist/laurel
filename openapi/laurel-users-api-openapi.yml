  /api/v1/customers/{customerId}/users/{userId}/identities/bulk:
    post:
      description: Adds multiple external identities to a specific user in a single request. Prevents duplicate identities with the same type and value.
      operationId: CustomerUserController_createBulkUserIdentities_v1
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer's id
        schema:
          format: objectid
          type: string
      - name: userId
        required: true
        in: path
        description: user's id
        schema:
          format: objectid
          type: string
      requestBody:
        required: true
        description: Array of identities to add to the user
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserIdentitiesBulkDto'
      responses:
        '200':
          description: All identities successfully added to user
      summary: Add multiple identities to a user
      tags:
      - Users
  /api/v1/customers/{customerId}/users/{userId}/email-aliases:
    post:
      description: Adds one or more email aliases to a user. Each alias must be unique within the customer (across both aliases and primary emails).
      operationId: CustomerUserController_createEmailAliases_v1
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer's id
        schema:
          format: objectid
          type: string
      - name: userId
        required: true
        in: path
        description: user's id
        schema:
          format: objectid
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEmailAliasesRequestDto'
      responses:
        '201':
          description: ''
      summary: Add email aliases
      tags:
      - Users
    delete:
      description: Removes an email alias from a user.
      operationId: CustomerUserController_deleteEmailAlias_v1
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer's id
        schema:
          format: objectid
          type: string
      - name: userId
        required: true
        in: path
        description: user's id
        schema:
          format: objectid
          type: string
      - name: email
        required: true
        in: query
        description: Email alias address to remove
        schema:
          format: email
          example: alias@example.com
          type: string
      responses:
        '200':
          description: ''
      summary: Remove an email alias
      tags:
      - Users
    get:
      description: Returns all email aliases for a user.
      operationId: CustomerUserController_getEmailAliases_v1
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer's id
        schema:
          format: objectid
          type: string
      - name: userId
        required: true
        in: path
        description: user's id
        schema:
          format: objectid
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAliasesResponseDto'
      summary: Get email aliases
      tags:
      - Users
