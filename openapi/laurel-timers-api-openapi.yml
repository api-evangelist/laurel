    V3TimerDraftResponseDto:
      type: object
      properties:
        status:
          type: string
          description: Status of the timer
          enum:
          - initialized
        _id:
          type: string
          description: Timer identifier
          format: objectid
        customerId:
          type: string
          description: Customer identifier
          format: objectid
        userId:
          type: string
          description: User identifier
          format: objectid
        date:
          type: string
          description: Date associated with this timer (iso date no time)
          example: '2022-08-12'
          format: iso-date
        createdAt:
          type: string
          description: Timer creation timestamp
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        updatedAt:
          type: string
          description: Timer last updated timestamp
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        summary:
          type: string
          description: Optionally provide a summary associated with this timer
          nullable: true
        initiative:
          description: Associated Initiative (null for anonymous timers)
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/UserInitiativeDto'
          - $ref: '#/components/schemas/PmsInitiativeDto'
        entryId:
          type: string
          description: Optionally associate an Entry
          format: objectid
          nullable: true
        manualAdjustmentMs:
          type: number
          description: Manual adjustment in milliseconds (always >= 0 for initialized timers)
          format: double
        codes:
          description: Timer draft's codes
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/CodeDigest'
      required:
      - status
      - _id
      - customerId
      - userId
      - date
      - createdAt
      - updatedAt
      - manualAdjustmentMs
    V2TimerResponseDto:
      type: object
      properties:
        _id:
          type: string
          description: the identifier of this timer
          format: objectid
        customerId:
          type: string
          description: the identifier of the customer whose user owns this timer
          format: objectid
        entryId:
          type: string
          description: the identifier of the entry which this timer belongs to
          format: objectid
        startedAt:
          type: string
          description: the timestamp when this timer was started
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        userId:
          type: string
          description: the identifier of the user who owns this timer
          format: objectid
        summary:
          type: string
          description: summary of the timer
          nullable: true
      required:
      - _id
      - customerId
      - entryId
      - startedAt
      - userId
    V3StopTimerRequestDto:
      type: object
      properties:
        timerId:
          type: string
          description: The timer that should be stopped
          format: objectid
        stoppedAt:
          type: string
          description: When the timer was stopped, we use client time to account for clock drift
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        summary:
          type: string
          description: Optionally provide a summary, set to null to void existing summary
          nullable: true
        manualAdjustmentMs:
          type: number
          description: Optionally include a manual adjustment (Will clip to value that makes stoppedAt - startedAt at 0 if more negative)
          format: double
      required:
      - timerId
      - stoppedAt
    V3StoppedTimerInfo:
      type: object
      properties:
        timer:
          $ref: '#/components/schemas/V3StoppedTimerResponseDto'
        activity:
          $ref: '#/components/schemas/TimerActivityDto'
        entry:
          nullable: true
          type: object
          allOf:
          - $ref: '#/components/schemas/EntryDto'
      required:
      - timer
      - activity
      - entry
    SharedFromResponseDto:
      type: object
      properties:
        entryId:
          type: string
          description: id of the source entry that was shared
          format: objectid
        entryUserId:
          type: string
          description: id of the user who owns the source entry
          format: objectid
        sharerId:
          type: string
          description: id of the principal who performed the share action
          format: objectid
        sharerType:
          description: capacity in which the sharer acted
          enum:
          - user
          - admin
          - delegate
          type: string
        sharedAt:
          type: string
          description: date and time the share was initiated
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        entryUserName:
          type: string
          description: display name of the entry owner; resolved at read-time, absent on failure
          nullable: true
        sharerName:
          type: string
          description: display name of the principal who performed the share; resolved at read-time, absent on failure
          nullable: true
      required:
      - entryId
      - entryUserId
      - sharerId
      - sharerType
      - sharedAt
    PmsInitiativeDigest:
      type: object
      properties:
        type:
          description: initiative's type
          enum:
          - pms
          - user
          type: string
        _id:
          type: string
          description: initiative's id
          format: objectid
        billingType:
          description: initiative's billing type
          enum:
          - billable
          - non-billable
          type: string
        callSign:
          type: string
          description: a short name or abbreviation that identifies this pms initiative
          nullable: true
        unitIncrements:
          type: number
          description: unit of billing increments for this initiative
          format: double
        status:
          type: string
          description: 'initiative''s status (active/inactive). Optional for backwards compatibility

            with entries whose denormalized digest predates this field — those entries

            gain status on the next initiative update via natural digest propagation.'
          enum:
          - active
          - inactive
          nullable: true
        locale:
          type: string
          description: BCP-47 locale for this initiative (e.g. en-US, fr-CA)
          enum:
          - da-DK
          - de-DE
          - en-CA
          - en-GB
          - en-US
          - es-ES
          - es-MX
          - fi-FI
          - fr-CA
          - fr-FR
          - is-IS
          - it-IT
          - ko-KR
          - nl-NL
          - no-NO
          - pt-PT
          - sv-SE
          nullable: true
        externalId:
          type: string
          description: initiative's external id
        name:
          type: string
          description: a short name or code that identifies this initiative
        description:
          type: string
          description: the full name of the initiative
        client:
          description: the client this initiative belongs to
          allOf:
          - $ref: '#/components/schemas/ClientDigest'
      required:
      - type
      - _id
      - billingType
      - unitIncrements
      - externalId
      - name
      - description
      - client
    PmsInitiativePropsDto:
      type: object
      properties:
        _id:
          type: string
          description: identifier of the initiative props
          format: objectid
        colorHex:
          type: string
          description: the hex color code for the initiative props
        tags:
          type: array
          description: array of initiative props tags
          items:
            type: string
            enum:
            - pinned
        userId:
          type: string
          description: identifier of the user who owns the initiative props
          format: objectid
        nickname:
          type: string
          description: the nickname assigned to this initiative by the user
          nullable: true
      required:
      - _id
      - colorHex
      - tags
      - userId
    V3StoppedTimerResponseDto:
      type: object
      properties:
        status:
          type: string
          description: Status of the timer
          enum:
          - stopped
        _id:
          type: string
          description: Original timer identifier
          format: objectid
        customerId:
          type: string
          description: Customer identifier
          format: objectid
        userId:
          type: string
          description: User identifier
          format: objectid
        startedAt:
          type: string
          description: Timestamp when timer started
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        stoppedAt:
          type: string
          description: Timestamp when timer stopped
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        durationMs:
          type: number
          description: Duration in milliseconds
          format: double
        activityId:
          type: string
          description: The Activity created from this stopped timer
          format: objectid
        entryId:
          type: string
          description: The Entry associated with this timer, when timer is anonymous this is None
          format: objectid
          nullable: true
        initiativeId:
          type: string
          description: The Initiative associated with this timer
          format: objectid
          nullable: true
      required:
      - status
      - _id
      - customerId
      - userId
      - startedAt
      - stoppedAt
      - durationMs
      - activityId
