  /api/v1/customers/{customerId}/initiatives:
    get:
      operationId: CustomerInitiativeController_search_v1
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer id
        schema:
          format: objectid
          type: string
      - name: page
        required: false
        in: query
        schema:
          minimum: 1
          format: int64
          type: number
      - name: pageSize
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 150
          format: int64
          type: number
      - name: search
        required: false
        in: query
        schema:
          minLength: 2
          maxLength: 100
          type: string
      - name: sortBy
        required: false
        in: query
        schema:
          type: string
          enum:
          - name
          - callSign
          - createdAt
          - updatedAt
      - name: sortOrder
        required: false
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: status
        required: false
        in: query
        schema:
          type: string
          enum:
          - active
          - inactive
      - name: billingType
        required: false
        in: query
        schema:
          type: string
          enum:
          - billable
          - non-billable
      - name: initiativeIds
        required: false
        in: query
        schema:
          minItems: 1
          maxItems: 50
          allOf:
          - $ref: '#/components/schemas/Object'
      - name: clientIds
        required: false
        in: query
        schema:
          minItems: 1
          maxItems: 50
          allOf:
          - $ref: '#/components/schemas/Object'
