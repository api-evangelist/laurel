        groupIds:
          description: list of group ids that have access to this initiative
          nullable: true
          type: array
          items:
            type: string
            format: objectid
        locale:
          type: string
          description: BCP-47 locale for this initiative (e.g. en-US, fr-CA)
          enum:
          - da-DK
          - de-DE
          - en-CA
          - en-GB
          - en-US
          - es-ES
          - es-MX
          - fi-FI
          - fr-CA
          - fr-FR
          - is-IS
          - it-IT
          - ko-KR
          - nl-NL
          - no-NO
          - pt-PT
          - sv-SE
          nullable: true
        status:
          description: initiative's status
          enum:
          - active
          - inactive
          type: string
        unitIncrements:
          type: number
          description: unit of billing increments for this initiative
          format: double
        updatedAt:
          type: string
          description: date and time this initiative was last updated
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        type:
          description: initiative's type
          enum:
          - pms
          type: string
        description:
          type: string
          description: the full long name of the initiative
        externalId:
          type: string
          description: initiative's external id
        name:
          type: string
          description: a short name or code that identifies this initiative
        allowFrom:
          type: string
          description: earliest calendar date on which this initiative is valid for use (date-only, midnight UTC, inclusive)
          example: '2022-08-12'
          format: iso-date
          nullable: true
        allowTo:
          type: string
          description: latest calendar date on which this initiative is valid for use (date-only, midnight UTC, inclusive)
          example: '2022-08-12'
          format: iso-date
          nullable: true
        internalAccessRestrictions:
          description: defines Laurel-managed internal access restrictions for the initiative
          allOf:
          - $ref: '#/components/schemas/InitiativeAccess'
        client:
          description: the client this initiative belongs to
          allOf:
          - $ref: '#/components/schemas/ClientDigest'
      required:
      - _id
      - billingType
      - callSign
      - createdAt
      - customerId
      - status
      - unitIncrements
      - updatedAt
      - type
      - description
      - externalId
      - name
      - client
    ImportCodeDto:
      type: object
      properties:
        codeExternalId:
          type: string
        codeTypeExternalId:
          type: string
      required:
      - codeExternalId
      - codeTypeExternalId
    InitiativeAccessDto:
      type: object
      properties:
        initiativeExternalId:
          type: string
        access:
          $ref: '#/components/schemas/Dto'
      required:
      - initiativeExternalId
      - access
    SetCustomerInitiativeCodesBatchDto:
      type: object
      properties:
        initiatives:
          type: array
          items:
            $ref: '#/components/schemas/InitiativeCodesDto'
      required:
      - initiatives
    UserInitiativeResponseDto:
      type: object
      properties:
        _id:
          type: string
          description: initiative's id
          format: objectid
        billingType:
          description: initiative's billing type
          enum:
          - billable
          - non-billable
          type: string
        callSign:
          type: string
          description: a short name or abbreviation that identifies this initiative
        createdAt:
          type: string
          description: date and time this initiative was created
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        customerId:
          type: string
          description: id of customer who owns this initiative
          format: objectid
        groupIds:
          description: list of group ids that have access to this initiative
          nullable: true
          type: array
          items:
            type: string
            format: objectid
        locale:
          type: string
          description: BCP-47 locale for this initiative (e.g. en-US, fr-CA)
          enum:
          - da-DK
          - de-DE
          - en-CA
          - en-GB
          - en-US
          - es-ES
          - es-MX
          - fi-FI
          - fr-CA
          - fr-FR
          - is-IS
          - it-IT
          - ko-KR
          - nl-NL
          - no-NO
          - pt-PT
          - sv-SE
          nullable: true
        status:
          description: initiative's status
          enum:
          - active
          - inactive
          type: string
        unitIncrements:
          type: number
          description: unit of billing increments for this initiative
          format: double
        updatedAt:
          type: string
          description: date and time this initiative was last updated
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        type:
          description: initiative's type
          enum:
          - user
          type: string
        name:
          type: string
          description: a name that identifies this initiative for the user
        userId:
          type: string
          description: the userId of the user to whom this initiative belongs
          format: objectid
        isLaurelCreatedNotModifiable:
          type: boolean
          description: indicates this initiative was created by Laurel and cannot be modified or deleted except for unitIncrements
          nullable: true
      required:
      - _id
      - billingType
      - callSign
      - createdAt
      - customerId
      - status
      - unitIncrements
      - updatedAt
      - type
      - name
      - userId
    InitiativeAccessRestrictionsUserResponseDto:
      type: object
      properties:
        userId:
          type: string
          description: User's internal ID
          format: objectid
        name:
          type: string
          description: User's full name (firstName + lastName)
        email:
          type: string
          description: User's email address
        wallsId:
          type: string
          description: User's Walls identity ID, null if user has no Walls identity
          nullable: true
        groupMembership:
          description: Groups the user belongs to (filtered to initiative groups), with id and name
          type: array
          items:
            $ref: '#/components/schemas/GroupMembershipDto'
        internalRestrictionType:
          type: string
          description: Type of internal access restriction if user is on the list, null otherwise
          enum:
          - allow
          - deny
          nullable: true
        externalRestrictionType:
          type: string
          description: Type of external access restriction if user is on the list, null otherwise
          enum:
          - allow
          - deny
          nullable: true
        hasAccess:
          type: boolean
          description: Whether the user has access to this initiative
        accessChecks:
          description: Detailed access check results explaining why user has or doesn't have access
          type: array
          items:
            type: string
            enum:
            - external_deny_list_passed
            - external_deny_list_failed
            - external_allow_list_passed
            - external_allow_list_failed
            - internal_deny_list_passed
            - internal_deny_list_failed
            - internal_allow_list_passed
            - internal_allow_list_failed
            - external_group_check_passed
            - external_group_check_failed
            - internal_group_check_passed
            - internal_group_check_failed
      required:
      - userId
      - name
      - email
      - wallsId
      - groupMembership
      - hasAccess
      - accessChecks
