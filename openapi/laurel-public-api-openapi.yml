          description: a short name or abbreviation that identifies this pms initiative
          nullable: true
        unitIncrements:
          type: number
          description: unit of billing increments for this initiative
          format: double
        status:
          type: string
          description: 'initiative''s status (active/inactive). Optional for backwards compatibility

            with entries whose denormalized digest predates this field — those entries

            gain status on the next initiative update via natural digest propagation.'
          enum:
          - active
          - inactive
          nullable: true
        locale:
          type: string
          description: BCP-47 locale for this initiative (e.g. en-US, fr-CA)
          enum:
          - da-DK
          - de-DE
          - en-CA
          - en-GB
          - en-US
          - es-ES
          - es-MX
          - fi-FI
          - fr-CA
          - fr-FR
          - is-IS
          - it-IT
          - ko-KR
          - nl-NL
          - no-NO
          - pt-PT
          - sv-SE
          nullable: true
        name:
          type: string
          description: the name user has given this initiative
      required:
      - type
      - _id
      - billingType
      - unitIncrements
      - name
    Identity:
      type: object
      properties:
        type:
          description: type of the external identity
          enum:
          - aderant
          - auth0
          - azure
          - email
          - external-billing-system
          - elite
          - intercom
          - juris
          - cisco-cdr
          - mixpanel
          - phone
          - phone-extension
          - salesforce
          - segment
          - vitally
          - walls
          - zendesk
          - zoom
          - exchange
          - user-principal-name
          - cisco-webex
          - ringcentral
          - google
          type: string
        value:
          type: string
          description: external identifier
        customerId:
          type: string
          description: optional customer id to bind the identity to
          format: objectid
          nullable: true
      required:
      - type
      - value
    CustomerEntryResponseDto:
      type: object
      properties:
        entryId:
          type: string
          description: entry's id
          format: objectid
        externalId:
          type: string
          description: entry's external id
        customerId:
          type: string
          description: id of customer who the owner belongs to
          format: objectid
        userId:
          type: string
          description: user who owns the entry
          format: objectid
        creationMethod:
          description: the creation method of the entry
          enum:
          - async
          - user
          - pms
          - shared
          type: string
        releasedBy:
          type: string
          description: the identifier of the user who released the entry
          format: objectid
        createdBy:
          type: string
          description: the identifier of the user who created the entry
          format: objectid
        workDate:
          type: string
          description: the date this entry is released to
          example: '2022-08-12'
          format: iso-date
        createdAt:
          type: string
          description: date and time this entry was created
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        updatedAt:
          type: string
          description: date and time this entry was updated last
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        initiativeExternalId:
          type: string
          description: entry's initiative external Id
        clientExternalId:
          type: string
          description: initiative's client external Id
        summary:
          type: string
          description: entry's summary
        unitIncrementCount:
          type: number
          description: sum of unit increments from this entry's sources and adjustments
          format: int64
        incrementDurationInSeconds:
          type: number
          description: entry duration in seconds
          format: int64
        firstReleaseAttemptedAt:
          type: string
          description: first date and time this entry was release attempted
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        lastReleasePendingAt:
          type: string
          description: last date and time this entry was release pended
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        lastReleaseFailedAt:
          type: string
          description: last date and time this entry was release failed
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        releaseSuccessAt:
          type: string
          description: date and time this entry was released successfully
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        isDeleted:
          type: boolean
          description: is entry soft deleted
        notes:
          type: string
          description: entry's notes
        releaseCount:
          type: number
          format: int64
          minimum: 0
        lastSyncedAt:
          type: string
          description: date and time when the entry was last synced with the PMS
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        initiativeName:
          type: string
          description: initiative name
        clientName:
          type: string
          description: client name
        billingType:
          description: initiative billing type
          enum:
          - billable
          - non-billable
          type: string
        codes:
          description: all of the codes assigned to the entry
          type: array
          items:
            $ref: '#/components/schemas/GetCustomerEntriesCodeResponseDto'
      required:
