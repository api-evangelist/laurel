    BulkUnreleaseEntryDto:
      type: object
      properties:
        workDateStart:
          type: string
          example: '2022-08-12'
          format: iso-date
        workDateEnd:
          type: string
          example: '2022-08-12'
          format: iso-date
        userIds:
          type: array
          items:
            type: string
            format: objectid
      required:
      - workDateStart
      - workDateEnd
    ReleaseSucceededRequestDto:
      type: object
      properties:
        externalId:
          type: string
          description: entry's external id from billing system
        reReleaseFailedMessages:
          description: list of errors from re-release attempt
          type: array
          items:
            type: string
            minLength: 0
    PmsInitiativePropsDigest:
      type: object
      properties:
        type:
          description: type of the initiative for these props
          enum:
          - pms
          type: string
        colorHex:
          type: string
          description: the hex color code for this initiative's display to the user
          example: fec828
          format: color-hex
        tags:
          type: array
          description: initiative prop's tags
          items:
            type: string
            enum:
            - pinned
        nickname:
          type: string
          description: if set, is the nickname user has set for this initiative
          nullable: true
        initiative:
          description: the pms initiative that is represented by these initiative props
          allOf:
          - $ref: '#/components/schemas/PmsInitiativeDigest'
      required:
      - type
      - colorHex
      - tags
      - initiative
    ClientDigest:
      type: object
      properties:
        _id:
          type: string
          description: client's id
          format: objectid
        externalId:
          type: string
          description: client's external id
        name:
          type: string
          description: a name that identifies this client
        description:
          type: string
          description: client's description
        callSign:
          type: string
          description: a short name or abbreviation that identifies this client
        type:
          type: string
          description: client's type, default is client
          enum:
          - client
          - parent
          nullable: true
        parentClientId:
          type: string
          description: id of the parent client
          format: objectid
          nullable: true
      required:
      - _id
      - externalId
      - name
      - description
      - callSign
    ReleaseOneEntryDto:
      type: object
      properties:
        workDate:
          type: string
          description: the date the entry's work was done
          example: '2022-08-12'
          format: iso-date
        releasedFrom:
          type: string
          description: Source of the release request
          enum:
          - time-control
          - timesheet
          nullable: true
    OverrideOneEntryRequestV2Dto:
      type: object
      properties:
        summary:
          type: string
          description: if set, will update entry's summary
        unitIncrementCountAdjustmentsInSeconds:
          type: number
          description: unit increments adjustments in seconds - min/max is 31536000 (1 year)
          format: double
        initiativeExternalId:
          type: string
          description: if set, will update entry's initiativeId
        codes:
          type: array
          description: if set, will update entry's codes
          minItems: 1
          items:
            $ref: '#/components/schemas/CodeAndCodeTypeExternalIdDto'
        workDate:
          type: string
          description: the date this entry is released to
          example: '2022-08-12'
          format: iso-date
        notes:
