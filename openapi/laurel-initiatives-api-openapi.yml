components:
  schemas:
    SetCustomerInitiativeAccessWallsDto:
      type: object
      properties:
        type:
          description: type of access.
          enum:
          - allow
          - deny
          type: string
        wallIds:
          description: list of users whose access is either allowed or denied for an initiative by walls ID.
          type: array
          items:
            type: string
      required:
      - type
      - wallIds
    Dto:
      type: object
      properties:
        externalId:
          type: string
          description: code's external id
        name:
          type: string
          description: code's name
        description:
          type: string
          description: code's description, can be empty
        codeTypeExternalId:
          type: string
          description: code's type's external id
        orderingSequence:
          type:
          - string
          - 'null'
          description: ordering sequence for UI sorting (alphanumeric)
        group:
          type:
          - string
          - 'null'
          description: group identifier for categorizing codes
        isDisabled:
          type:
          - boolean
          - 'null'
          description: whether the code is disabled, added from ingestion process
      required:
      - externalId
      - name
      - description
      - codeTypeExternalId
    ImportCustomerInitiativesBatchDto:
      type: object
      properties:
        initiatives:
          type: array
          items:
            $ref: '#/components/schemas/Dto'
      required:
      - initiatives
    SetCustomerInitiativeCodesBatchDto:
      type: object
      properties:
        initiatives:
          type: array
          items:
            $ref: '#/components/schemas/InitiativeCodesDto'
      required:
      - initiatives
    ImportCustomerInitiativeConsolidatedDto:
      type: object
      properties:
        initiative:
          $ref: '#/components/schemas/ConsolidatedInitiativeSubDto'
        codes:
          $ref: '#/components/schemas/ConsolidatedCodesSubDto'
        entryValidationRules:
          $ref: '#/components/schemas/ConsolidatedValidationSubDto'
      required:
      - initiative
      - codes
      - entryValidationRules
    SetCustomerInitiativeAccessBatchDto:
      type: object
      properties:
        initiatives:
          type: array
          items:
            $ref: '#/components/schemas/InitiativeAccessDto'
      required:
      - initiatives
    InitiativeAccessWithWallsDto:
      type: object
      properties:
        initiativeExternalId:
          type: string
        access:
          $ref: '#/components/schemas/SetCustomerInitiativeAccessWallsDto'
      required:
      - initiativeExternalId
      - access
    ConsolidatedValidationSubDto:
      type: object
      properties:
        isRequiredCodeTypeExternalIdsEmpty:
          type: boolean
        requiredCodeTypeExternalIds:
          type: array
          items:
            type: string
    ConsolidatedInitiativeSubDto:
      type: object
      properties:
        billingType:
          description: the billing type for this initiative
          enum:
          - billable
          - non-billable
          type: string
        externalId:
          type: string
          description: initiative's external id
        name:
          type: string
          description: a name that identifies this initiative
        description:
          type: string
          description: the description of the initiative
        callSign:
          type: string
          description: a short name or abbreviation that identifies this initiative
        clientExternalId:
          type: string
          description: external id of client this initiative belongs to
        externalGroupIds:
          description: list of external group ids that have access to this initiative
          type:
          - array
          - 'null'
          items:
            type: string
        unitIncrements:
          type: number
          description: unit of billing increments for this initiative in seconds (36=0.01, 360=0.1, 900=0.25)
          format: double
        status:
          type: string
          description: initiative's status
          enum:
          - active
          - inactive
        locale:
          type:
          - string
          - 'null'
          description: BCP-47 locale for this initiative (e.g. en-US, fr-CA)
          enum:
          - da-DK
          - de-DE
          - en-CA
          - en-GB
          - en-US
          - es-ES
          - es-MX
          - fi-FI
          - fr-CA
          - fr-FR
          - is-IS
          - it-IT
          - ko-KR
          - nl-NL
          - no-NO
          - pt-PT
          - sv-SE
        allowFrom:
          type:
          - string
          - 'null'
          description: earliest calendar date on which this initiative is valid for use (date-only, midnight UTC)
          example: '2022-08-12'
          format: iso-date
        allowTo:
          type:
          - string
          - 'null'
          description: latest calendar date on which this initiative is valid for use, inclusive (date-only, midnight UTC)
          example: '2022-08-12'
          format: iso-date
      required:
      - billingType
      - externalId
      - name
      - description
      - callSign
      - clientExternalId
      - unitIncrements
    SetCustomerInitiativeCodesDto:
      type: object
      properties:
        codeExternalIds:
          minItems: 1
          maxItems: 2500
          type: array
          items:
            type: string
      required:
      - codeExternalIds
    ImportCodeDto:
      type: object
      properties:
        codeExternalId:
          type: string
        codeTypeExternalId:
          type: string
      required:
      - codeExternalId
      - codeTypeExternalId
