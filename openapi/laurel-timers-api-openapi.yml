          example: '2022-08-12'
          format: iso-date
        summary:
          type: string
          description: Optionally provide a summary associated with this timer
          nullable: true
        manualAdjustmentMs:
          type: number
          description: Optionally include a manual adjustment to persist (Can't be negative)
          format: double
          nullable: true
        initiativeId:
          type: string
          description: The initiative to associate with the Entry created with this timer
          format: objectid
      required:
      - date
      - initiativeId
    ReleaseFailedInfo:
      type: object
      properties:
        status:
          enum:
          - release-failed
          type: string
        releaseFailedErrors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReleaseFailedError'
      required:
      - status
      - releaseFailedErrors
    EntryTimerCarryover:
      type: object
      properties:
        originId:
          type: string
          format: objectid
      required:
      - originId
    TimerActivityDto:
      type: object
      properties:
        _id:
          type: string
          description: activity's id
          format: objectid
        customerId:
          type: string
          description: id of customer who owns this activity
          format: objectid
        userId:
          type: string
          description: id of user who owns this activity
          format: objectid
        creationMethod:
          type: string
          enum:
          - timer
        isLocked:
          type: boolean
          description: if true, this activity is locked and cannot be updated
        category:
          type: string
          description: category of this activity, if any
          nullable: true
        technology:
          type: string
          description: technology of this activity, if any
          nullable: true
        title:
          type: string
          description: activity's title
        detail:
          type: string
          description: activity's detail
        startedAt:
          type: string
          description: date and time this activity started
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        stoppedAt:
          type: string
          description: date and time this activity stopped
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        externalId:
          type: string
          description: activity's external id
          nullable: true
        assignedBy:
          description: how the activity's initiative was assigned
          enum:
          - none
          - user
          - ml
          type: string
        createdAt:
          type: string
          description: date and time activity was created
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        updatedAt:
          type: string
          description: date and time activity was last updated
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        threadId:
          type: string
          description: activity's thread id
          nullable: true
        enhancedByAi:
          type: boolean
          description: indicates if this activity was enhanced by AI
          nullable: true
        isCopiedByAdmin:
          type: boolean
          description: indicates if this activity was copied by admin
          nullable: true
        isSeeded:
          type: boolean
          description: indicates if this activity was created via seeding
          nullable: true
        disableThreading:
          type: boolean
          description: if true, disables threading for this activity
          nullable: true
        initiative:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/UserInitiativeDto'
          - $ref: '#/components/schemas/PmsInitiativeDto'
      required:
      - _id
      - customerId
      - userId
      - creationMethod
      - isLocked
      - title
      - detail
      - startedAt
      - stoppedAt
      - assignedBy
      - createdAt
      - updatedAt
    EntryDto:
      type: object
      properties:
        _id:
          type: string
          description: entry's id
          format: objectid
        schemaVersion:
          type: string
          description: entry's schemaVersion
        customerId:
          type: string
          description: id of customer who the owner belongs to
          format: objectid
        userId:
          type: string
          description: if of user who owns the entry
          format: objectid
        enrichmentCorrelationId:
          type: string
          description: entry's enrichmentCorrelationId to be used by enrichment service
          nullable: true
        statusInfo:
          description: entry's status info
          oneOf:
          - $ref: '#/components/schemas/ReleaseFailedInfo'
          - $ref: '#/components/schemas/ReleaseValidationPendingInfo'
          - $ref: '#/components/schemas/ReleasePendingInfo'
          - $ref: '#/components/schemas/ReleaseSuccessInfo'
          - $ref: '#/components/schemas/ReleaseSuccessLockedInfo'
          - $ref: '#/components/schemas/ValidationFailedInfo'
          - $ref: '#/components/schemas/ValidationPendingInfo'
          - $ref: '#/components/schemas/ValidationSuccessInfo'
        creationMethod:
          description: the creation method of the entry
          enum:
          - async
          - user
          - pms
          - shared
          type: string
        createdAsTimer:
          type: boolean
          description: if true, this entry was created by a user for use as a timer
          nullable: true
        workDate:
          type: string
          description: the date the entry's work was done, this is required for released entries
          example: '2022-08-12'
          format: iso-date
        isLocked:
          type: boolean
          description: if true, this entry is locked and cannot be updated
        summary:
          type: string
          description: entry's summary
        unitIncrementCountFromSources:
          type: number
          description: sum of unit increments from this entry's sources
          format: double
        unitIncrementCountAdjustments:
          type: number
          description: user modified overrides to entry unit increment total
          format: double
        sources:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/NestedActivitySource'
            - $ref: '#/components/schemas/NestedEntrySource'
            - $ref: '#/components/schemas/NestedTimerSource'
        externalId:
          type: string
          description: entry's external id
          nullable: true
        createdAt:
          type: string
          description: date and time this entry was created
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        updatedAt:
          type: string
          description: date and time this entry was updated last
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        overlapTimeInSeconds:
          type: number
          description: entry's duration in seconds with overlap
          format: int64
          nullable: true
        isDeleted:
          type: boolean
          description: set to true if entry is soft deleted
          nullable: true
        notes:
          type: string
          description: entry's notes
          nullable: true
        splitFromActivityId:
          type: string
          description: 'If set, the id of the captured activity this entry was split from.

            Shared across all entries/activities produced by one split (sibling key),

            and the seam for a future undo/merge. The source activity is soft-deleted,

            so its id uniquely identifies the split.'
          format: objectid
          nullable: true
        supersededByEntryId:
          type: string
          description: 'Surviving entry this one was merged into. Set so PMS sync-in leaves the

            superseded entry deleted instead of resurrecting it as a duplicate.'
          format: objectid
          nullable: true
        releaseCount:
          type: number
          description: entry's release count
          format: int64
          minimum: 0
          nullable: true
        lastSyncedAt:
          type: string
          description: date and time when the entry was last synced with the PMS
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
          nullable: true
        timerDurationAdjustmentInSeconds:
          type: number
          description: adjustment in seconds to be applied to timer duration
          format: int64
          nullable: true
        releasedFrom:
          type: string
          description: source of the release request
          enum:
          - time-control
          - timesheet
          nullable: true
        complianceRules:
          description: entry's compliance rules
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/ComplianceRule'
        deletedForRetentionAt:
          type: string
          description: date and time entry data was deleted for retention
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
          nullable: true
        timerCarryover:
          nullable: true
          type: object
          allOf:
          - $ref: '#/components/schemas/EntryTimerCarryover'
        autoStoppedReason:
          type: string
          description: 'Indicates the reason this entry''s timer was automatically stopped by the

            system (as opposed to being stopped by the user). `null`/undefined for

            entries whose timers were stopped manually or by the overnight job.'
          enum:
          - twelve_hour_limit
          nullable: true
        autostopDismissedAt:
          type: string
          description: 'Set when the user explicitly dismisses the auto-stop strip via the × button.

            Once set, the strip is never re-shown for this entry.'
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
          nullable: true
        timezoneAtCreation:
          type: string
          description: 'The user''s IANA timezone at the time this entry was created.

            Immutable after creation. Null when the user had no timezone configured.'
          nullable: true
        isShared:
          type: boolean
          description: 'Set to `true` when the entry has been shared with at least one recipient.

            Written synchronously by the share endpoint; never reset.

            Absent on entries that pre-date the sharing feature or have never been shared.'
          nullable: true
        externalSources:
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/ExternalSource'
        workCodes:
          description: all of the codes assigned to the entry
          type: array
          items:
            $ref: '#/components/schemas/CodeAssignment'
        initiative:
          description: entry's initiative information
          oneOf:
          - $ref: '#/components/schemas/UserInitiativeDto'
          - $ref: '#/components/schemas/PmsInitiativeDto'
        sharedFrom:
          description: 'Present only on recipient-side copies. Contains the source entry context

            and display names resolved at read-time via identity-service.'
          nullable: true
          type: object
          allOf:
          - $ref: '#/components/schemas/SharedFromResponseDto'
      required:
      - _id
      - schemaVersion
      - customerId
      - userId
      - statusInfo
      - creationMethod
      - workDate
      - isLocked
      - summary
      - unitIncrementCountFromSources
      - unitIncrementCountAdjustments
      - sources
      - createdAt
      - updatedAt
      - workCodes
      - initiative
    UserInitiativePropsDto:
      type: object
      properties:
        _id:
          type: string
          description: identifier of the initiative props
          format: objectid
        colorHex:
          type: string
          description: the hex color code for the initiative props
        tags:
          type: array
          description: array of initiative props tags
          items:
            type: string
            enum:
            - pinned
        userId:
          type: string
          description: identifier of the user who owns the initiative props
          format: objectid
      required:
      - _id
      - colorHex
      - tags
      - userId
    CodeDigest:
      type: object
      properties:
        _id:
          type: string
          description: code's id
          format: objectid
        externalId:
          type: string
          description: code's external id
        name:
          type: string
          description: code's name
        description:
          type: string
          description: code's description, can be empty
        type:
          description: code's type
          allOf:
          - $ref: '#/components/schemas/CodeTypeDigest'
      required:
      - _id
      - externalId
      - name
      - description
      - type
    V3AdjustTimerDraftRequestDto:
      type: object
      properties:
        timerDraftId:
          type: string
          description: The ID of the timer draft to adjust
          format: objectid
        now:
          type: string
          description: The "now" time from the client (as UTC), we use the client's now to prevent clock drift issues
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        summary:
          type: string
          description: Optionally provide a summary, set to null to void existing summary
          nullable: true
        manualAdjustmentMs:
          type: number
          description: Optionally include a manual adjustment (Will clip to value that makes now - startedAt at 0 if more negative)
          format: double
          nullable: true
        codeIds:
          description: Optionally update timer draft's code ids
          nullable: true
          type: array
          items:
            type: string
            format: objectid
        initiativeId:
          type: string
          description: Optionally update timer draft's initiative
          format: objectid
          nullable: true
      required:
      - timerDraftId
      - now
    V3RunningTimerResponseDto:
      type: object
      properties:
        status:
          type: string
          description: Status of the timer
          enum:
          - running
        _id:
          type: string
          description: Timer identifier
          format: objectid
        customerId:
          type: string
          description: Customer identifier
          format: objectid
        userId:
          type: string
          description: User identifier
          format: objectid
        createdAt:
          type: string
          description: Timer creation timestamp
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        startedAt:
          type: string
          description: Timestamp when timer started running
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        summary:
          type: string
          description: Optionally provide a summary associated with this timer
          nullable: true
        initiativeId:
          type: string
          description: Optionally associate an Initiative
          format: objectid
          nullable: true
        entry:
          description: Optionally associate an Entry
          nullable: true
          type: object
          allOf:
          - $ref: '#/components/schemas/EntryDto'
        manualAdjustmentMs:
          type: number
          description: Manual adjustment in milliseconds (can be negative, but total duration >= 0)
          format: double
      required:
      - status
      - _id
      - customerId
      - userId
      - createdAt
      - startedAt
      - manualAdjustmentMs
    ComplianceRule:
      type: object
      properties:
        ruleKey:
          type: string
          description: rule key
        description:
          type: string
          description: rule description
          nullable: true
        enforcementLevel:
          description: enforcement level
          enum:
          - block
          - acknowledge
          - warn
          - 'off'
          type: string
      required:
      - ruleKey
      - enforcementLevel
    PmsInitiativePropsDigest:
      type: object
      properties:
        type:
          description: type of the initiative for these props
          enum:
          - pms
          type: string
        colorHex:
          type: string
          description: the hex color code for this initiative's display to the user
          example: fec828
          format: color-hex
        tags:
          type: array
          description: initiative prop's tags
          items:
            type: string
            enum:
            - pinned
        nickname:
          type: string
          description: if set, is the nickname user has set for this initiative
          nullable: true
        initiative:
          description: the pms initiative that is represented by these initiative props
          allOf:
          - $ref: '#/components/schemas/PmsInitiativeDigest'
      required:
      - type
      - colorHex
      - tags
      - initiative
    Timer:
      type: object
      properties:
        _id:
          type: string
          description: the identifier of the timer
          format: objectid
        schemaVersion:
          type: string
          description: timer's schemaVersion
        createdAt:
          type: string
          description: the date and time this timer was created
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        customerId:
          type: string
          description: the identifier of the customer who owns this timer
          format: objectid
        date:
          type: string
          description: the date associated with this timer
          example: '2022-08-12'
          format: iso-date
        durationInSeconds:
          type: number
          description: the duration in seconds that this timer has been active
          format: double
        initiativeProps:
          oneOf:
          - $ref: '#/components/schemas/PmsInitiativePropsDigest'
          - $ref: '#/components/schemas/UserInitiativePropsDigest'
        isLocked:
          type: boolean
          description: indicates whether if this timer is locked or not
        summary:
          type: string
          description: the summary assigned to this timer, can be empty
        updatedAt:
          type: string
          description: the date and time this timer was updated last
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        userId:
          type: string
          description: the identifier of the user who owns this timer
          format: objectid
        codes:
          description: codes that are assigned to this timer
          type: array
          items:
            $ref: '#/components/schemas/CodeDigest'
      required:
      - _id
      - schemaVersion
      - createdAt
      - customerId
      - date
      - durationInSeconds
      - initiativeProps
      - isLocked
      - summary
      - updatedAt
      - userId
      - codes
    ClientDigest:
      type: object
      properties:
        _id:
          type: string
          description: client's id
          format: objectid
        externalId:
          type: string
          description: client's external id
        name:
          type: string
          description: a name that identifies this client
        description:
          type: string
          description: client's description
        callSign:
          type: string
          description: a short name or abbreviation that identifies this client
        type:
          type: string
          description: client's type, default is client
          enum:
          - client
          - parent
          nullable: true
        parentClientId:
          type: string
          description: id of the parent client
          format: objectid
          nullable: true
      required:
      - _id
      - externalId
      - name
      - description
      - callSign
    NestedEntrySource:
      type: object
      properties:
        _id:
          type: string
          description: source's id
          format: objectid
        type:
          description: type of entry source
          enum:
          - entry
          type: string
          default: entry
        enrichmentCorrelationId:
          type: string
          description: entry's enrichmentCorrelationId to be used by enrichment service
          nullable: true
        summary:
          type: string
          description: entry's summary
        unitIncrementCountAdjustments:
          type: number
          description: user modified overrides to entry unit increment total
          format: double
      required:
      - _id
      - type
      - summary
      - unitIncrementCountAdjustments
    CreateTimerDto:
      type: object
      properties:
        date:
          type: string
          description: the date associated with this timer
          example: '2022-08-12'
          format: iso-date
        summary:
          type: string
          description: the summary assigned to this timer, can be empty
        codeIds:
          description: the code ids assigned to this timer
          type: array
          items:
            type: string
            format: objectid
        durationInSeconds:
          type: number
          format: double
        initiativeId:
          type: string
          description: the initiative assigned to this timer, if any
          format: objectid
      required:
      - date
      - summary
      - codeIds
    UpdateTimerRequestDto:
      type: object
      properties:
        summary:
          type: string
          description: summary of the timer
    V3StartTimerSuccessResponseDto:
      type: object
      properties:
        result:
          type: string
          enum:
          - started timer
