      type: object
      properties:
        type:
          description: type of access.
          enum:
          - allow
          - deny
          type: string
        wallIds:
          description: list of users whose access is either allowed or denied for an initiative by walls ID.
          type: array
          items:
            type: string
      required:
      - type
      - wallIds
    ImportCustomerInitiativesBatchDto:
      type: object
      properties:
        initiatives:
          type: array
          items:
            $ref: '#/components/schemas/Dto'
      required:
      - initiatives
    ImportCustomerInitiativeConsolidatedDto:
      type: object
      properties:
        initiative:
          $ref: '#/components/schemas/ConsolidatedInitiativeSubDto'
        codes:
          $ref: '#/components/schemas/ConsolidatedCodesSubDto'
        entryValidationRules:
          $ref: '#/components/schemas/ConsolidatedValidationSubDto'
      required:
      - initiative
      - codes
      - entryValidationRules
    InitiativeAccessRestrictionsUsersLookupRequestDto:
      type: object
      properties:
        userIds:
          description: List of user IDs to check (max 50, min 1)
          minItems: 1
          maxItems: 50
          type: array
          items:
            type: string
            format: objectid
      required:
      - userIds
    ClientDigest:
      type: object
      properties:
        _id:
          type: string
          description: client's id
          format: objectid
        externalId:
          type: string
          description: client's external id
        name:
          type: string
          description: a name that identifies this client
        description:
          type: string
          description: client's description
        callSign:
          type: string
          description: a short name or abbreviation that identifies this client
        type:
          type: string
          description: client's type, default is client
          enum:
          - client
          - parent
          nullable: true
        parentClientId:
          type: string
          description: id of the parent client
          format: objectid
          nullable: true
      required:
      - _id
      - externalId
      - name
      - description
      - callSign
    InitiativeGroupRestrictions:
      type: object
      properties:
        type:
          type: string
          description: type of group restriction (allow-only for now)
          enum:
          - allow
        groupIds:
          description: list of groups whose access is allowed for an initiative
          type: array
          items:
            type: string
            format: objectid
      required:
      - type
      - groupIds
    InitiativeInternalAccessResponseDto:
      type: object
      properties:
        type:
          description: type of access restriction
          enum:
          - allow
          - deny
          type: string
        userIds:
          description: list of users whose access is either allowed or denied for the initiative
          type: array
          items:
            type: string
            format: objectid
      required:
      - type
      - userIds
    ConsolidatedInitiativeSubDto:
      type: object
      properties:
        billingType:
          description: the billing type for this initiative
          enum:
          - billable
          - non-billable
          type: string
        externalId:
          type: string
          description: initiative's external id
        name:
          type: string
          description: a name that identifies this initiative
