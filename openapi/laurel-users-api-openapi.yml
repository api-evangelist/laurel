openapi: 3.2.0
info:
  title: Laurel Users API
  version: '1'
  contact: {}
  description: 'Operations tagged Users across 2 of this provider''s published API definitions: laurel-identity-openapi-original.json, laurel-ingestion-openapi-original.json. Each path carries the servers of the definition it was published in.'
security:
- ApiBearerAuth: []
tags:
- name: Users
paths:
  /api/v1/customers/{customerId}/users:
    get:
      operationId: CustomerUserController_search_v1
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer's id
        schema:
          format: objectid
          type: string
      - name: search
        required: false
        in: query
        description: searches first & last names, nickname, & email using a query
        schema:
          type: string
      - name: integration
        required: false
        in: query
        schema:
          type:
          - string
          - 'null'
          enum:
          - cloud-assistant-cdr
          - cloud-assistant-google
          - cloud-assistant-microsoft-exchange
          - cloud-assistant-microsoft-teams
          - cloud-assistant-zoom
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/User'
                - $ref: '#/components/schemas/UserIntegrationProjection'
      summary: returns all users for a customer, filtered by optional search parameter
      tags:
      - Users
  /api/v2/customers/{customerId}/users:
    get:
      operationId: CustomerUserController_searchV2_v2
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer's id
        schema:
          format: objectid
          type: string
      - name: page
        required: false
        in: query
        schema:
          minimum: 1
          format: int64
          type: number
      - name: pageSize
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 150
          format: int64
          type: number
      - name: search
        required: false
        in: query
        schema:
          minLength: 2
          maxLength: 100
          type:
          - string
          - 'null'
      - name: includeRoles
        required: false
        in: query
        schema:
          type:
          - array
          - 'null'
          items:
            type: string
      - name: excludeRoles
        required: false
        in: query
        schema:
          type:
          - array
          - 'null'
          items:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchUsersResponseDto'
      tags:
      - Users
      summary: Customer user controller search V2 v2
      x-summary-source: derived
  /api/v1/customers/{customerId}/users-lite:
    get:
      operationId: CustomerUserController_searchLite_v1
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer's id
        schema:
          format: objectid
          type: string
      - name: search
        required: false
        in: query
        description: searches first & last names, nickname, & email using a query
        schema:
          type: string
      - name: integration
        required: false
        in: query
        schema:
          type:
          - string
          - 'null'
          enum:
          - cloud-assistant-cdr
          - cloud-assistant-google
          - cloud-assistant-microsoft-exchange
          - cloud-assistant-microsoft-teams
          - cloud-assistant-zoom
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserLite'
      tags:
      - Users
      summary: Customer user controller search lite v1
      x-summary-source: derived
  /api/v1/customers/{customerId}/users/by-ids:
    get:
      description: Retrieve multiple users from a customer by providing user IDs as repeated query parameters (userIds=id1&userIds=id2&userIds=id3). Maximum 50 IDs per request.
      operationId: CustomerUserController_getUsersByIds_v1
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer's id
        schema:
          format: objectid
          type: string
      - name: userIds
        required: true
        in: query
        schema:
          minItems: 1
          maxItems: 50
          type: array
          items:
            type: string
            format: objectid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
      summary: Get multiple users by their IDs
      tags:
      - Users
  /api/v1/customers/{customerId}/users/lookup:
    get:
      operationId: CustomerUserController_lookupUser_v1
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer's id
        schema:
          format: objectid
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
      tags:
      - Users
      summary: Customer user controller lookup user v1
      x-summary-source: derived
  /api/v1/customers/{customerId}/users/batch/lookup:
    post:
      description: Batch equivalent of GET users/lookup. Returns every distinct user under the customer who matches at least one of the given identities.
      operationId: CustomerUserController_lookupUsersBatch_v1
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer's id
        schema:
          format: objectid
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupUsersBatchRequestDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  users:
                    items:
                      $ref: '#/components/schemas/User'
                    type: array
                required:
                - users
                type: object
      summary: Look up multiple users by identities
      tags:
      - Users
  /api/v1/customers/{customerId}/users/translate-timekeeper-ids:
    post:
      operationId: CustomerUserController_translateTimekeeperIdsToUserIds_v1
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer's id
        schema:
          format: objectid
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslateTimekeeperIdsRequestDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslateTimekeeperIdsResponseDto'
      summary: Translate timekeeper IDs to user IDs
      tags:
      - Users
  /api/v1/customers/{customerId}/users/lookup/identity:
    post:
      deprecated: true
      operationId: CustomerUserController_lookupUserIdentityType_v1
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer's id
        schema:
          format: objectid
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                email:
                  example: email address of the user
                  type: string
                identityType:
                  example: Identity type of the user
                  type: string
              required:
              - email
              - identityType
              type: object
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
      summary: Customer user controller lookup user identity type v1
      tags:
      - Users
      x-summary-source: derived
  /api/v2/customers/{customerId}/users/lookup/identity:
    get:
      operationId: CustomerUserController_lookupUserByIdentity_v2
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer's id
        schema:
          format: objectid
          type: string
      - name: type
        required: true
        in: query
        description: type of the external identity
        schema:
          type: string
          enum:
          - aderant
          - auth0
          - azure
          - email
          - external-billing-system
          - elite
          - intercom
          - juris
          - cisco-cdr
          - mixpanel
          - phone
          - phone-extension
          - salesforce
          - segment
          - vitally
          - walls
          - zendesk
          - zoom
          - exchange
          - user-principal-name
          - cisco-webex
          - ringcentral
          - google
      - name: value
        required: true
        in: query
        description: external identifier
        schema:
          minLength: 1
          maxLength: 256
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      tags:
      - Users
      summary: Customer user controller lookup user by identity v2
      x-summary-source: derived
  /api/v1/customers/{customerId}/users/{userId}/identities:
    get:
      operationId: CustomerUserController_lookupUserIdentity_v1
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer's id
        schema:
          format: objectid
          type: string
      - name: userId
        required: true
        in: path
        description: user's id
        schema:
          format: objectid
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Identity'
      tags:
      - Users
      summary: Customer user controller lookup user identity v1
      x-summary-source: derived
    post:
      operationId: CustomerUserController_createNewUserIdentity_v1
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer's id
        schema:
          format: objectid
          type: string
      - name: userId
        required: true
        in: path
        description: user's id
        schema:
          format: objectid
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Identity'
      responses:
        '201':
          description: ''
      tags:
      - Users
      summary: Customer user controller create new user identity v1
      x-summary-source: derived
    put:
      operationId: CustomerUserController_updateUserIdentity_v1
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer's id
        schema:
          format: objectid
          type: string
      - name: userId
        required: true
        in: path
        description: user's id
        schema:
          format: objectid
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Identity'
      responses:
        '200':
          description: ''
      tags:
      - Users
      summary: Customer user controller update user identity v1
      x-summary-source: derived
  /api/v1/customers/{customerId}/users/{userId}/super-delegate:
    patch:
      operationId: CustomerUserController_setUserSuperDelegateStatus_v1
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer's id
        schema:
