      - customerId
      - userId
      - creationMethod
      - createdAt
      - updatedAt
      - initiativeExternalId
      - clientExternalId
      - summary
      - unitIncrementCount
      - incrementDurationInSeconds
      - initiativeName
      - billingType
      - codes
