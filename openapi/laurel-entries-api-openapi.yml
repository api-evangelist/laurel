  /api/v3/public/customers/{customerId}/entries:
    get:
      operationId: CustomerEntryPublicController_findManyWithPaginationV3_v3
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer id
        schema:
          format: objectid
          type: string
      - name: page
        required: false
        in: query
        schema:
          minimum: 1
          format: int64
          type: number
      - name: pageSize
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 150
          format: int64
          type: number
      - name: search
        required: false
        in: query
        schema:
          minLength: 3
          maxLength: 100
          type: string
      - name: userId
        required: false
        in: query
        schema:
          format: objectid
          type: string
      - name: userIds
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
            format: objectid
      - name: status
        required: false
        in: query
        schema:
          type: string
          enum:
          - release-failed
          - release-pending
          - release-success
          - release-success-locked
          - release-validation-pending
          - validation-failed
          - validation-pending
          - validation-success
      - name: statuses
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - release-failed
            - release-pending
            - release-success
            - release-success-locked
            - release-validation-pending
            - validation-failed
            - validation-pending
            - validation-success
      - name: workDateStart
        required: false
        in: query
        schema:
          format: iso-date-time
          example: '2022-08-12T20:44:48Z'
          type: string
      - name: workDateEnd
        required: false
        in: query
        schema:
          format: iso-date-time
          example: '2022-08-12T20:44:48Z'
          type: string
      - name: workDates
        required: false
        in: query
        schema:
          example: '2022-08-12T20:44:48Z'
          type: array
          items:
            type: string
            format: iso-date-time
      - name: updatedAfter
        required: false
        in: query
        schema:
          format: iso-date-time
          example: '2022-08-12T20:44:48Z'
          type: string
      - name: updatedOnOrBefore
        required: false
        in: query
        schema:
          format: iso-date-time
          example: '2022-08-12T20:44:48Z'
          type: string
      - name: initiativeId
        required: false
        in: query
        schema:
          format: objectid
          type: string
      - name: isDeleted
        required: false
        in: query
        schema:
          type: boolean
      - name: initiativeType
        required: false
        in: query
        schema:
          type: string
          enum:
          - pms
          - user
      - name: billingType
        required: false
        in: query
        description: the billing type to filter entries by
        schema:
          type: string
          enum:
          - billable
          - non-billable
      - name: clientId
        required: false
        in: query
        description: the client to filter initiatives by
        schema:
          format: objectid
          type: string
      - name: allowEmptyTimers
        required: false
        in: query
        schema:
          type: boolean
      - name: isShared
        required: false
        in: query
        description: When true, filter to entries shared with at least one recipient.
        schema:
          nullable: true
          type: boolean
      - name: isFromShare
        required: false
        in: query
        description: When true, filter to recipient-copy entries. ORs with `isShared`.
        schema:
          nullable: true
          type: boolean
      - name: timezoneNotSet
        required: false
        in: query
        description: 'Union with `timezones[]`: when true, also include entries with `timezoneAtCreation === null`.'
        schema:
          type: boolean
      - name: sortBy
        required: false
        in: query
        description: the field to sort entries by
        schema:
          type: string
          enum:
          - workDate
          - createdAt
          - status
      - name: sortOrder
        required: false
        in: query
        description: the sort order
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: timezones
        required: false
        in: query
        description: Optional IANA timezone filter (e.g. "America/New_York").
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: ''
      tags:
      - Entries
