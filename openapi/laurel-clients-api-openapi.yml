          - assistant-windows
          - directory
          - audit
          - test-user-creation
          - agent
          - siem-forwarder
          type: string
        type:
          description: which type of client this is - corresponds to Auth0 application type
          enum:
          - regular_web
          - spa
          - native
          - non_interactive
          type: string
        customerId:
          type:
          - string
          - 'null'
          description: id of the customer the client belongs to
          format: objectid
        tenantId:
          type:
          - string
          - 'null'
          description: client's tenant
          format: objectid
        permissionIds:
          description: ids of permissions granted to service tokens from this client
          type: array
          items:
            type: string
            format: objectid
        userPermissionBoundaryIds:
          description: ids of permissions that limit what's granted in user tokens from this client
          type: array
          items:
            type: string
            format: objectid
        allowedCallbackUrls:
          description: list of URLs that can be call back after user authentication
          default: []
          type: array
          items:
            type: string
        allowedLogoutUrls:
          description: list of URLs that are valid to redirect to after logout
          default: []
          type: array
          items:
            type: string
        allowedCorsOrigins:
          description: list of URLs that are allowed to make requests
          default: []
          type: array
          items:
            type: string
      required:
      - name
      - description
      - service
      - type
      - permissionIds
      - allowedCallbackUrls
      - allowedLogoutUrls
      - allowedCorsOrigins
    OnCredentialsExchangeRequestDto:
      type: object
      properties:
        clientId:
          type: string
          description: id of client used for logging in
          format: objectid
        externalClientId:
          type: string
          description: id of the auth0 client that's generating a service token
        customerId:
          type:
          - string
          - 'null'
          description: id of the customer the client belongs to
          format: objectid
      required:
      - clientId
      - externalClientId
    UpdateClientDto:
      type: object
      properties:
        allowedCallbackUrls:
          description: list of URLs that can be call back after user authentication
          type: array
          items:
            type: string
        allowedCorsOrigins:
          description: list of URLs that are allowed to make requests
          type: array
          items:
            type: string
        allowedLogoutUrls:
          description: list of URLs that are valid to redirect to after logout
          type: array
          items:
            type: string
        clientSecret:
          type: string
          description: client's secret in Auth0
          maxLength: 64
          minLength: 64
        permissionIds:
          description: if set, updates permissions granted to service tokens from this client
          type: array
          items:
            type: string
            format: objectid
        service:
          type: string
          description: if set, updates the service this client is for
