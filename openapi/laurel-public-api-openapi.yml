      properties:
        _id:
          type: string
          description: entry's id
          format: objectid
        customerId:
          type: string
          description: id of customer who the owner belongs to
          format: objectid
        userId:
          type: string
          description: if of user who owns the entry
          format: objectid
        enrichmentCorrelationId:
          type: string
          description: entry's enrichmentCorrelationId to be used by enrichment service
        statusInfo:
          description: entry's status info
          oneOf:
          - $ref: '#/components/schemas/ReleaseFailedInfo'
          - $ref: '#/components/schemas/ReleaseValidationPendingInfo'
          - $ref: '#/components/schemas/ReleasePendingInfo'
          - $ref: '#/components/schemas/ReleaseSuccessInfo'
          - $ref: '#/components/schemas/ReleaseSuccessLockedInfo'
          - $ref: '#/components/schemas/ValidationFailedInfo'
          - $ref: '#/components/schemas/ValidationPendingInfo'
          - $ref: '#/components/schemas/ValidationSuccessInfo'
        creationMethod:
          description: the creation method of the entry
          enum:
          - async
          - user
          - pms
          - shared
          type: string
        createdAsTimer:
          type: boolean
          description: if true, this entry was created by a user for use as a timer
        workDate:
          type: string
          description: the date this entry is released to
          example: '2022-08-12'
          format: iso-date
        isLocked:
          type: boolean
          description: if true, this entry is locked and cannot be updated
        summary:
          type: string
          description: entry's summary
        unitIncrementCountFromSources:
          type: number
          description: sum of unit increments from this entry's sources
          format: double
        unitIncrementCountAdjustments:
          type: number
          description: user modified overrides to entry unit increment total
          format: double
        incrementDurationInSeconds:
          type: number
          description: entry duration in seconds
          format: double
        initiativeProps:
          description: is entry's initiative
          oneOf:
          - $ref: '#/components/schemas/PmsInitiativePropsDigest'
          - $ref: '#/components/schemas/UserInitiativePropsDigest'
        workCodes:
          type: array
          description: all of the codes assigned to the entry
          items:
            $ref: '#/components/schemas/CodeAssignment'
        sources:
          type: array
          items:
            oneOf:
            - items:
                $ref: '#/components/schemas/NestedActivitySource'
              type: array
            - items:
                $ref: '#/components/schemas/NestedEntrySource'
              type: array
            - items:
                $ref: '#/components/schemas/NestedTimerSource'
              type: array
        externalId:
          type: string
          description: entry's external id
        createdAt:
          type: string
          description: date and time this entry was created
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        updatedAt:
          type: string
          description: date and time this entry was updated last
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        hasOverlap:
          type: boolean
          description: entry's overlap state
        overlapTimeInSeconds:
          type: number
          description: entry's duration in seconds with overlap
          format: int64
        isDeleted:
          type: boolean
          description: is entry soft deleted
        notes:
          type: string
          description: entry's notes
        firstReleaseAttemptedAt:
          type: string
          description: first date and time this entry was release attempted
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        releaseCount:
          type: number
          description: entry's release count
          format: int64
          minimum: 0
        lastSyncedAt:
          type: string
          description: date and time when the entry was last synced with the PMS
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        timerDurationAdjustmentInSeconds:
          type: number
          description: adjustment in seconds to be applied to timer duration
          format: int64
        complianceRules:
          type: array
          description: entry's compliance rules
          items:
            $ref: '#/components/schemas/ComplianceRule'
        initiativeName:
          type: string
          description: initiative name
        clientName:
          type: string
          description: client name
        billingType:
          description: initiative billing type
          enum:
          - billable
          - non-billable
          type: string
        timezoneAtCreation:
          type: string
          description: IANA timezone of the user at the time of entry creation
          nullable: true
        autoStoppedReason:
          type: string
          description: 'Set when the entry''s timer was stopped automatically by the 12-hour cap.

            Absent/null when the timer was stopped manually or by the overnight job.'
          enum:
          - twelve_hour_limit
          nullable: true
        autostopDismissedAt:
          type: string
          description: 'Set when the user explicitly dismisses the auto-stop strip.

            Once set, the strip is never re-shown for this entry.'
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
          nullable: true
        isShared:
          type: boolean
          description: 'True when this entry has been shared with at least one recipient.

            Absent on entries that pre-date the sharing feature or have never been shared.'
          nullable: true
        sharedFrom:
          description: 'Present only on recipient-side copies. Contains the source entry context

            and display names of the entry owner and the principal who performed the share,

            resolved at read-time via identity-service (absent on hydration failure).'
          nullable: true
          type: object
          allOf:
          - $ref: '#/components/schemas/SharedFromResponseDto'
        isSplittable:
          type: boolean
          description: whether this entry can be split into multiple entries
      required:
      - _id
      - customerId
      - userId
      - statusInfo
      - creationMethod
      - isLocked
      - summary
      - unitIncrementCountFromSources
      - unitIncrementCountAdjustments
      - incrementDurationInSeconds
      - initiativeProps
      - sources
      - createdAt
      - updatedAt
      - initiativeName
      - billingType
      - isSplittable
