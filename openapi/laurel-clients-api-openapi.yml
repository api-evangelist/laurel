          format: objectid
        tenantId:
          type: string
          description: if set, updates client's tenant
          format: objectid
        userPermissionBoundaryIds:
          description: if set, updates permissions that limit what's granted in user tokens from this client
          type: array
          items:
            type: string
            format: objectid
    ImportCustomerClientsBatchDto:
      type: object
      properties:
        clients:
          type: array
          items:
            $ref: '#/components/schemas/ImportCustomerClientDto'
      required:
      - clients
    ImportCustomerClientDto:
      type: object
      properties:
        externalId:
          type: string
          description: client's external id
        name:
          type: string
          description: client's name
        callSign:
          type: string
          description: client's call sign
        description:
          type: string
          description: client's description
        type:
          type:
          - string
          - 'null'
          description: 'client''s type (optional): if not provided semantic default is client, parent client must have type parent'
          enum:
          - client
          - parent
        parentClientExternalId:
          type:
          - string
          - 'null'
          description: parent client's external id (optional)
      required:
      - externalId
      - name
      - callSign
      - description
    Object:
      type: object
      properties: {}
    ClientDto:
      type: object
      properties:
        _id:
          type: string
          format: objectid
        externalId:
          type: string
        name:
          type: string
        description:
          type: string
        callSign:
          type: string
        type:
          type:
          - string
          - 'null'
          description: if null or undefined, semantic default is ClientType.Client
          enum:
          - client
          - parent
        parentClientId:
          type:
          - string
          - 'null'
          format: objectid
      required:
      - _id
      - externalId
      - name
      - description
      - callSign
    Client_2:
      type: object
      properties:
        _id:
          type: string
          description: client's id
          format: objectid
        schemaVersion:
          type: string
          description: client's schemaVersion
        customerId:
          type: string
          description: id of customer who owns this client
          format: objectid
        externalId:
          type: string
          description: client's external id
        name:
          type: string
          description: a name that identifies this client
        description:
          type: string
          description: client's description
        callSign:
          type: string
          description: a short name or abbreviation that identifies this client
        type:
          type:
          - string
          - 'null'
          description: client's type, default is client
          enum:
          - client
          - parent
        parentClientId:
          type:
          - string
          - 'null'
          description: id of the parent client
          format: objectid
        createdAt:
          type: string
          description: date and time this client was created
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        updatedAt:
          type: string
          description: date and time this client was updated last
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
      required:
      - _id
      - schemaVersion
      - customerId
      - externalId
      - name
      - description
      - callSign
      - createdAt
      - updatedAt
    AffectedCountResponseDto:
      type: object
      properties:
        affectedClientCount:
          type: number
          format: double
        affectedInitiativeCount:
          type: number
          format: double
        totalAffectedCount:
          type: number
          format: double
