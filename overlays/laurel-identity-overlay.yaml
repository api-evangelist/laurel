overlay: 1.0.0
info:
  title: API Evangelist enhancements for Identity Service API
  version: 1.0.0
extends: openapi/laurel-identity-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-provider: laurel
    x-apievangelist-service: identity
    x-apievangelist-docs: https://developer.laurel.ai/services/identity
    x-apievangelist-harvested: '2026-07-19'
    x-apievangelist-source: https://developer.laurel.ai/llms.txt
    description: Laurel Identity Service API. Laurel automatically captures work activity across the applications
      professionals use, enriches it into review-ready timesheets, and releases it into the firm's billing
      system. Harvested by API Evangelist; the published document ships an empty description.
- target: $.servers
  update:
  - url: https://identity.laurel.ai
    description: Production identity Service. Time Service endpoints are region-specific and issued per
      customer.
- target: $.components.securitySchemes['ApiBearerAuth']
  update:
    description: Bearer JWT obtained from the client_credentials exchange at https://identity.laurel.ai/api/v1/oauth/token
      with audience https://timeautomation.com. Tokens expire in 86400 seconds.
    x-token-endpoint: https://identity.laurel.ai/api/v1/oauth/token
    x-token-ttl-seconds: 86400
- target: $.info
  update:
    x-apievangelist-tags:
    - Ably
    - Clients
    - Customers
    - Data Retention Audits
    - Delegators
    - Health Check
    - Impersonation Events
    - OAuth
    - Onboarding Profiles
    - Permissions
    - Public
    - Roles
    - Tenants
    - Twilio
    - User Groups
    - Users
    x-apievangelist-operation-count: 95
    x-apievangelist-public-operation-count: 6
    x-apievangelist-gaps:
    - no servers[] declared in the published document
    - no 4xx/5xx responses declared on any operation
    - majority of operations carry no summary or description
    - info.description is empty
