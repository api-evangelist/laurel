            - $ref: '#/components/schemas/NestedTimerSource'
        externalId:
          type: string
          description: entry's external id
          nullable: true
        createdAt:
          type: string
          description: date and time this entry was created
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        updatedAt:
          type: string
          description: date and time this entry was updated last
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        overlapTimeInSeconds:
          type: number
          description: entry's duration in seconds with overlap
          format: int64
          nullable: true
        isDeleted:
          type: boolean
          description: set to true if entry is soft deleted
          nullable: true
        notes:
          type: string
          description: entry's notes
          nullable: true
        splitFromActivityId:
          type: string
          description: 'If set, the id of the captured activity this entry was split from.

            Shared across all entries/activities produced by one split (sibling key),

            and the seam for a future undo/merge. The source activity is soft-deleted,

            so its id uniquely identifies the split.'
          format: objectid
          nullable: true
        supersededByEntryId:
          type: string
          description: 'Surviving entry this one was merged into. Set so PMS sync-in leaves the

            superseded entry deleted instead of resurrecting it as a duplicate.'
          format: objectid
          nullable: true
        releaseCount:
          type: number
          description: entry's release count
          format: int64
          minimum: 0
          nullable: true
        lastSyncedAt:
          type: string
          description: date and time when the entry was last synced with the PMS
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
          nullable: true
        timerDurationAdjustmentInSeconds:
          type: number
          description: adjustment in seconds to be applied to timer duration
          format: int64
          nullable: true
        releasedFrom:
          type: string
          description: source of the release request
          enum:
          - time-control
          - timesheet
          nullable: true
        complianceRules:
          description: entry's compliance rules
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/ComplianceRule'
        deletedForRetentionAt:
          type: string
          description: date and time entry data was deleted for retention
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
          nullable: true
        timerCarryover:
          nullable: true
          type: object
          allOf:
          - $ref: '#/components/schemas/EntryTimerCarryover'
        autoStoppedReason:
          type: string
          description: 'Indicates the reason this entry''s timer was automatically stopped by the

            system (as opposed to being stopped by the user). `null`/undefined for

            entries whose timers were stopped manually or by the overnight job.'
          enum:
          - twelve_hour_limit
          nullable: true
        autostopDismissedAt:
          type: string
          description: 'Set when the user explicitly dismisses the auto-stop strip via the × button.

            Once set, the strip is never re-shown for this entry.'
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
          nullable: true
        timezoneAtCreation:
          type: string
          description: 'The user''s IANA timezone at the time this entry was created.

            Immutable after creation. Null when the user had no timezone configured.'
          nullable: true
        isShared:
          type: boolean
          description: 'Set to `true` when the entry has been shared with at least one recipient.

            Written synchronously by the share endpoint; never reset.

            Absent on entries that pre-date the sharing feature or have never been shared.'
          nullable: true
        externalSources:
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/ExternalSource'
        workCodes:
          description: all of the codes assigned to the entry
          type: array
          items:
            $ref: '#/components/schemas/CodeAssignment'
        initiative:
          description: entry's initiative information
          oneOf:
          - $ref: '#/components/schemas/UserInitiativeDto'
          - $ref: '#/components/schemas/PmsInitiativeDto'
        sharedFrom:
          description: 'Present only on recipient-side copies. Contains the source entry context

            and display names resolved at read-time via identity-service.'
          nullable: true
          type: object
          allOf:
          - $ref: '#/components/schemas/SharedFromResponseDto'
      required:
      - _id
      - schemaVersion
      - customerId
      - userId
      - statusInfo
      - creationMethod
      - workDate
      - isLocked
      - summary
      - unitIncrementCountFromSources
      - unitIncrementCountAdjustments
      - sources
      - createdAt
      - updatedAt
      - workCodes
      - initiative
    ComplianceRule:
      type: object
      properties:
        ruleKey:
          type: string
          description: rule key
        description:
          type: string
          description: rule description
          nullable: true
        enforcementLevel:
          description: enforcement level
          enum:
          - block
          - acknowledge
          - warn
          - 'off'
          type: string
      required:
      - ruleKey
      - enforcementLevel
    NestedEntrySource:
      type: object
      properties:
        _id:
          type: string
          description: source's id
          format: objectid
        type:
          description: type of entry source
          enum:
          - entry
          type: string
          default: entry
        enrichmentCorrelationId:
          type: string
          description: entry's enrichmentCorrelationId to be used by enrichment service
          nullable: true
        summary:
          type: string
          description: entry's summary
        unitIncrementCountAdjustments:
          type: number
          description: user modified overrides to entry unit increment total
          format: double
      required:
      - _id
      - type
      - summary
      - unitIncrementCountAdjustments
    ShareEligibilityRequestDto:
      type: object
      properties:
        recipientUserIds:
          description: recipients to evaluate; the server returns one independent result per id
          minItems: 1
          type: array
          items:
            type: string
            format: objectid
      required:
      - recipientUserIds
    BulkCreateEntryResponseDto:
      type: object
      properties:
        succeeded:
          type: number
          description: Count of successfully created entries
          format: int64
          minimum: 0
        failed:
          type: number
          description: Count of failed entries
          format: int64
          minimum: 0
        errors:
          type: array
          description: Array of error details for failed entries
          items:
            $ref: '#/components/schemas/BulkCreateEntryErrorDto'
      required:
      - succeeded
      - failed
      - errors
    UpdateEntryLockStatusItemDto:
      type: object
      properties:
        entryExternalId:
          type: string
          description: External identifier for the entry
        isLocked:
          type: boolean
          description: Whether the entry is locked
        lockedAt:
          type: string
          description: 'When the entry was locked (ISO 8601) — only present when isLocked: true'
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
      required:
      - entryExternalId
      - isLocked
    ShareEligibilityResponseDto:
      type: object
      properties:
        results:
          description: one result per requested recipient, in request order
          type: array
          items:
            $ref: '#/components/schemas/ShareEligibilityResultDto'
      required:
      - results
    CodeDto:
      type: object
      properties:
        _id:
          type: string
          format: objectid
        externalId:
          type: string
        orderingSequence:
          type: string
          description: ordering sequence for UI sorting (alphanumeric)
          nullable: true
        group:
          type: string
          description: group identifier for categorizing codes
          nullable: true
        type:
          $ref: '#/components/schemas/CodeTypeDto'
      required:
      - _id
      - externalId
      - type
    CodeAssignment:
      type: object
      properties:
        assignedBy:
          description: entity that assigned the code.
          enum:
          - user
          - laurel
          type: string
        code:
          description: assigned code
          allOf:
          - $ref: '#/components/schemas/CodeDigest'
      required:
      - assignedBy
      - code
    ReleaseSuccessLockedInfo:
      type: object
      properties:
        status:
          enum:
          - release-success-locked
          type: string
        releasedAt:
          type: string
          description: date and time entry was originally released to PMS
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        releasedBy:
          type: string
          description: the identifier of the user who released the entry
          format: objectid
        lockedAt:
          type: string
          description: date the entry became locked in the PMS billing system
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
          nullable: true
        lastLockCheckAt:
          type: string
          description: date lock status was last checked by the Boomi job
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        reReleaseFailedMessages:
          type: array
          description: entry's re-release failed messages (retained from previous release-success state)
          minItems: 1
          items:
            $ref: '#/components/schemas/ReleaseFailedError'
          nullable: true
      required:
      - status
      - releasedAt
      - releasedBy
      - lastLockCheckAt
    ReleaseFailedRequestDto:
      type: object
      properties:
        errors:
          description: list of errors
          type: array
          items:
            type: string
            minLength: 1
      required:
      - errors
    ShareEntryCreatedItemDto:
      type: object
      properties:
        recipientUserId:
          type: string
          format: objectid
        recipientEntryId:
          type: string
          format: objectid
      required:
      - recipientUserId
      - recipientEntryId
    ReleaseValidationPendingInfo:
      type: object
      properties:
        status:
          enum:
          - release-validation-pending
          type: string
        releasePendedAt:
          type: string
          description: date and time entry was changed to release pending
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        releasePendedBy:
          type: string
          description: the identifier of the user who change the entry to release pending
          format: objectid
      required:
      - status
      - releasePendedAt
      - releasePendedBy
    NestedActivitySource:
      type: object
      properties:
        _id:
          type: string
          description: source's id
          format: objectid
        type:
          description: type of entry source
          enum:
          - activity
          type: string
          default: activity
        creationMethod:
          description: the creation method of the activity
          enum:
          - timer
          - tracked
          - user
          type: string
        category:
          type: string
          description: category of this activity, if any
          nullable: true
        technology:
          type: string
          description: technology of this activity, if any
          nullable: true
        source:
          type: string
          description: source of this activity (e.g. 'macos', 'windows'), if any
          nullable: true
        mechanism:
          type: string
          description: mechanism of this activity (e.g. browser used to access web app), if any
          nullable: true
        title:
          type: string
          description: activity's title
        detail:
          type: string
          description: activity's detail
        startedAt:
          type: string
          description: date and time this activity started
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        stoppedAt:
          type: string
          description: date and time this activity stopped
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        clusterId:
          type: string
          description: activity's clusterId
          nullable: true
        fromSuggestions:
          type: boolean
          description: whether this activity source was added from suggestions
          nullable: true
        fromThemes:
          type: boolean
          description: whether this activity source was added from themes
          nullable: true
        hasOverlap:
          type: boolean
          description: activity's overlap state
          nullable: true
        overlapTimeInSeconds:
          type: number
          description: activity's overlap time in seconds
          format: int64
          nullable: true
        threadId:
          type: string
          description: activity's thread id
          nullable: true
        disableThreading:
          type: boolean
          description: if true, disables threading for this activity
          nullable: true
        assignedAt:
          type: string
          description: 'Datetime this activity was assigned to the entry it currently belongs to.

            Unset on entries that predate the field; never back-filled.'
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
          nullable: true
      required:
      - _id
      - type
      - creationMethod
      - title
      - detail
      - startedAt
      - stoppedAt
    BulkCreateEntryRequestDto:
      type: object
      properties:
        entries:
          type: array
          description: Array of entries to create (minimum 1, maximum 100)
          minItems: 1
          maxItems: 100
