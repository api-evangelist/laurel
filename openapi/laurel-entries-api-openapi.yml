components:
  schemas:
    ReleasePendingTimekeeperIdDto:
      type: object
      properties:
        _id:
          type: string
          description: entry's id
          format: objectid
        customerId:
          type: string
          description: id of customer who the owner belongs to
          format: objectid
        userId:
          type: string
          description: if of user who owns the entry
          format: objectid
        workDate:
          type: string
          description: the date this entry is released to
          example: '2022-08-12'
          format: iso-date
        summary:
          type: string
          description: entry's summary
        unitIncrementCount:
          type: number
          description: sum of unit increments from this entry's sources and adjustments
          format: double
        incrementDurationInSeconds:
          type: number
          description: entry duration in seconds
          format: double
        externalId:
          type: string
          description: entry's external id
        notes:
          type: string
          description: entry's notes
        createdAt:
          type: string
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        updatedAt:
          type: string
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        timekeeperId:
          type: string
        initiativeProps:
          description: entry's initiative
          allOf:
          - $ref: '#/components/schemas/InitiativePropsDto'
        codes:
          description: all of the codes assigned to the entry
          type: array
          items:
            $ref: '#/components/schemas/CodeDto'
      required:
      - _id
      - customerId
      - userId
      - workDate
      - summary
      - unitIncrementCount
      - incrementDurationInSeconds
      - timekeeperId
      - initiativeProps
      - codes
    ReleaseSuccessInfo:
      type: object
      properties:
        status:
          enum:
          - release-success
          type: string
        releasedAt:
          type: string
          description: date and time entry was released
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        releasedBy:
          type: string
          description: the identifier of the user who released the entry
          format: objectid
        reReleaseFailedMessages:
          type: array
          description: entry's re-release failed messages
          minItems: 1
          items:
            $ref: '#/components/schemas/ReleaseFailedError'
          nullable: true
      required:
      - status
      - releasedAt
      - releasedBy
    CreateEntryRequestDto:
      type: object
      properties:
        _id:
          type: string
          description: optional custom id for the entry
          format: objectid
        workDate:
          type: string
          description: the date this entry is released to
          example: '2022-08-12'
          format: iso-date
        initiativeId:
          type: string
          description: entry's initiative id
          format: objectid
        codeIds:
          description: entry's code ids, if any
          type: array
          items:
            type: string
            format: objectid
        unitIncrementCountTotal:
          type: number
          description: sum of total unit increments from this entry's sources and adjustments
          format: double
        summary:
          type: string
          description: entry's summary
        enrichmentCorrelationId:
          type: string
          description: entry's enrichmentCorrelationId to be used by enrichment service
        activitySources:
          type: array
          description: entry's activity sources
          items:
            $ref: '#/components/schemas/ActivitySourceV2RequestDto'
        notes:
          type: string
          description: entry's notes
        timerDurationAdjustmentInSeconds:
          type: number
          description: adjustment in seconds to be applied to timer duration
          format: int64
        complianceRules:
          type: array
          description: entry's compliance rules
          items:
            $ref: '#/components/schemas/ComplianceRule'
        createdAsTimer:
          type: boolean
          description: if true, this entry was created by a user for use as a timer
        externalSources:
          type: array
          items:
            $ref: '#/components/schemas/ExternalSource'
      required:
      - workDate
      - initiativeId
      - unitIncrementCountTotal
      - summary
    ActivitySourceRequestDto:
      type: object
      properties:
        activityId:
          type: string
          description: activity's id
          format: objectid
        clusterId:
          type: string
          description: activity's clusterId
        fromSuggestions:
          type: boolean
          description: whether this activity source was added from suggestions
          nullable: true
        fromThemes:
          type: boolean
          description: whether this activity source was added from themes
          nullable: true
      required:
      - activityId
    NestedTimerSource:
      type: object
      properties:
        _id:
          type: string
          description: source's id
          format: objectid
        type:
          description: type of entry source
          enum:
          - timer
          type: string
          default: timer
        durationInSeconds:
          type: number
          description: the duration in seconds that this timer has been active
          format: double
        summary:
          type: string
          description: the summary assigned to this timer, can be empty
      required:
      - _id
      - type
      - durationInSeconds
      - summary
    BatchReleaseSucceededRequestDto:
      type: object
      properties:
        request:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/ReleaseUpdate'
      required:
      - request
    ShareEligibilityResultDto:
      type: object
      properties:
        recipientUserId:
          type: string
          description: the recipient this result is for
          format: objectid
        canShare:
          type: boolean
          description: 'hard block: false means the ethics-wall (initiative access) check denied this recipient —

            the only per-recipient block. Source-level failures surface as request errors, not here.'
        ineligibilityReasons:
          description: why sharing is blocked for this recipient when canShare is false; empty when canShare is true.
          type: array
          items:
            type: string
            enum:
            - initiative_restricted
            - self_share
            - user_not_found
        hasPreviousShare:
          type: boolean
          description: 'soft warn: the recipient already has an entry shared from this source'
      required:
      - recipientUserId
      - canShare
      - ineligibilityReasons
      - hasPreviousShare
    ShareEntryBlockedItemDto:
      type: object
      properties:
        recipientUserId:
          type: string
          format: objectid
        reason:
          type: string
      required:
      - recipientUserId
      - reason
    BulkDeleteUnreleasedEntryItemDto:
      type: object
      properties:
        userId:
          type: string
        externalId:
          type: string
        allowReleasedOverride:
          type: boolean
      required:
      - userId
      - externalId
    ValidationFailedInfo:
      type: object
      properties:
        status:
          enum:
          - validation-failed
          type: string
        errors:
          description: list of errors
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/EntryValidationError'
      required:
      - status
      - errors
    ValidationPendingInfo:
      type: object
      properties:
        status:
          enum:
          - validation-pending
          type: string
      required:
      - status
    CodeAndCodeTypeExternalIdDto:
      type: object
      properties:
        codeExternalId:
          type: string
          description: code's external id
        codeTypeExternalId:
          type: string
          description: code type's external id
      required:
      - codeExternalId
      - codeTypeExternalId
    InitiativeDigestDto:
      type: object
      properties:
        _id:
          type: string
          format: objectid
        externalId:
          type: string
        name:
          type: string
        billingType:
          enum:
          - billable
          - non-billable
          type: string
        unitIncrements:
          type: number
          format: double
        locale:
          type: string
          description: BCP-47 locale for this initiative (e.g. en-US, fr-CA)
          enum:
          - da-DK
          - de-DE
          - en-CA
          - en-GB
          - en-US
          - es-ES
          - es-MX
          - fi-FI
          - fr-CA
          - fr-FR
          - is-IS
          - it-IT
          - ko-KR
          - nl-NL
          - no-NO
          - pt-PT
          - sv-SE
          nullable: true
        client:
          $ref: '#/components/schemas/ClientDto'
      required:
      - _id
      - externalId
      - name
      - billingType
      - unitIncrements
      - client
    CreateEntryForUserRequestDto:
      type: object
      properties:
        workDate:
          type: string
          description: the date this entry is released to
          example: '2022-08-12'
          format: iso-date
        initiativeId:
          type: string
          description: entry's initiative id
          format: objectid
        codeIds:
          description: entry's code ids, if any
          type: array
          items:
            type: string
            format: objectid
        unitIncrementCountTotal:
          type: number
          description: sum of total unit increments from this entry's sources and adjustments
          format: double
        enrichmentCorrelationId:
          type: string
          description: entry's enrichmentCorrelationId to be used by enrichment service
        activitySources:
          type: array
          description: entry's activity sources
          items:
            $ref: '#/components/schemas/ActivitySourceV2RequestDto'
        notes:
          type: string
          description: entry's notes
        complianceRules:
          type: array
          description: entry's compliance rules
          items:
            $ref: '#/components/schemas/ComplianceRule'
        externalSources:
          type: array
          items:
            $ref: '#/components/schemas/ExternalSource'
        summary:
          type: string
          description: entry's summary
          nullable: true
      required:
      - workDate
      - initiativeId
      - unitIncrementCountTotal
    UserInitiativePropsDto:
      type: object
      properties:
        _id:
          type: string
          description: identifier of the initiative props
          format: objectid
        colorHex:
          type: string
          description: the hex color code for the initiative props
        tags:
          type: array
          description: array of initiative props tags
          items:
            type: string
            enum:
            - pinned
        userId:
          type: string
          description: identifier of the user who owns the initiative props
          format: objectid
      required:
      - _id
      - colorHex
      - tags
      - userId
    BulkUpdateUnreleasedEntriesRequestDto:
      type: object
      properties:
        entries:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/BulkUpdateUnreleasedEntryItemDto'
      required:
      - entries
    CodeDigest:
      type: object
      properties:
        _id:
          type: string
          description: code's id
          format: objectid
        externalId:
          type: string
          description: code's external id
        name:
          type: string
          description: code's name
        description:
          type: string
          description: code's description, can be empty
        type:
          description: code's type
          allOf:
          - $ref: '#/components/schemas/CodeTypeDigest'
      required:
      - _id
      - externalId
      - name
      - description
      - type
    BulkUpdateUnreleasedEntryItemDto:
      type: object
      properties:
        userId:
          type: string
        externalId:
          type: string
        workDate:
