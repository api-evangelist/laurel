aid: laurel
name: Laurel
description: 'Laurel is an AI timekeeping and work-intelligence platform for professional services
  firms — law, accounting and advisory. Rather than asking timekeepers to record their own time,
  Laurel passively captures work activity across the applications people already work in, then uses
  machine learning to enrich each activity with the who, what, when, where and how needed to build a
  review-ready timesheet. Reviewed time is released into the firm''s existing billing or
  practice-management system, and Laurel''s Signal product layers operational and profitability
  analytics on top of the resulting time data. Laurel exposes three public APIs — Identity, Time and
  Ingestion — authenticated with OAuth 2.0 machine-to-machine client credentials, and documents them
  at developer.laurel.ai for firms and partners building connectors.'
