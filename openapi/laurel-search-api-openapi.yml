          content:
            application/json:
              schema:
                oneOf:
                - items:
                    $ref: '#/components/schemas/InitiativeDtoSearchResultDto'
                  type: array
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/InitiativeDtoSearchResultDto'
                      type: array
                    nextPage:
                      type: number
                    totalItems:
                      type: number
                    totalPages:
                      type: number
                  type: object
      tags:
      - Search
components:
  schemas:
    InitiativeSearchResultDto:
      type: object
      properties:
        type:
          description: the type of search result
          enum:
          - initiative
          - initiative-props
          - initiative-dto
          type: string
        score:
          type: number
          description: the normalized search score
          format: double
        initiative:
          description: the initiative that is the result of search
          oneOf:
          - $ref: '#/components/schemas/PmsInitiativeResponseDto'
          - $ref: '#/components/schemas/UserInitiativeResponseDto'
        absoluteScore:
          type: number
          description: the raw Atlas Search score - internal use only, excluded from API response
      required:
      - type
      - score
      - initiative
    UserInitiativePropsResponseDto:
      type: object
      properties:
        _id:
          type: string
          description: identifier of the initiative props
          format: objectid
        colorHex:
          type: string
          description: the hex color code for the initiative props
        customerId:
          type: string
          description: identifier of the customer who owns the initiative props
          format: objectid
        tags:
          type: array
          description: array of initiative props tags
          items:
            type: string
            enum:
            - pinned
        type:
          description: type of initiative for this initiative props
          enum:
          - user
          type: string
        userId:
          type: string
          description: identifier of the user who owns the initiative props
          format: objectid
        initiative:
          description: the initiative for these props
          allOf:
          - $ref: '#/components/schemas/UserInitiativeDigest'
      required:
      - _id
      - colorHex
      - customerId
      - tags
      - type
      - userId
      - initiative
    UserInitiativeDto:
      type: object
      properties:
        _id:
          type: string
          description: initiative's id
          format: objectid
        billingType:
          description: initiative's billing type
          enum:
          - billable
          - non-billable
          type: string
        callSign:
          type: string
          description: a short name or abbreviation that identifies this initiative
        createdAt:
          type: string
          description: date and time this initiative was created
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        locale:
          type: string
          description: BCP-47 locale for this initiative (e.g. en-US, fr-CA)
          enum:
          - da-DK
          - de-DE
          - en-CA
          - en-GB
          - en-US
          - es-ES
          - es-MX
          - fi-FI
          - fr-CA
          - fr-FR
          - is-IS
          - it-IT
          - ko-KR
          - nl-NL
          - no-NO
          - pt-PT
          - sv-SE
          nullable: true
        status:
          description: initiative's status
          enum:
          - active
          - inactive
          type: string
        unitIncrements:
          type: number
          description: unit of billing increments for this initiative
          format: double
        updatedAt:
          type: string
          description: date and time this initiative was last updated
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        name:
          type: string
          description: a name that identifies this initiative for the user
        type:
          type: string
          enum:
          - user
        props:
          nullable: true
          type: object
          allOf:
          - $ref: '#/components/schemas/UserInitiativePropsDto'
      required:
      - _id
      - billingType
      - callSign
      - createdAt
      - status
      - unitIncrements
      - updatedAt
      - name
      - type
    InitiativePropsSearchResultDto:
      type: object
      properties:
        type:
          description: the type of search result
          enum:
          - initiative
          - initiative-props
          - initiative-dto
          type: string
        score:
          type: number
          description: the normalized search score
          format: double
        initiativeProps:
          description: the initiative props that is the result of search
          oneOf:
          - $ref: '#/components/schemas/PmsInitiativePropsResponseDto'
          - $ref: '#/components/schemas/UserInitiativePropsResponseDto'
        absoluteScore:
          type: number
          description: the raw Atlas Search score - internal use only, excluded from API response
      required:
      - type
      - score
      - initiativeProps
    UserInitiativeDigest:
      type: object
      properties:
        type:
          description: initiative's type
          enum:
          - user
          type: string
        _id:
          type: string
          description: initiative's id
          format: objectid
        billingType:
          description: initiative's billing type
          enum:
          - billable
          - non-billable
          type: string
        callSign:
          type: string
          description: a short name or abbreviation that identifies this pms initiative
          nullable: true
        unitIncrements:
          type: number
          description: unit of billing increments for this initiative
          format: double
        status:
          type: string
          description: 'initiative''s status (active/inactive). Optional for backwards compatibility

            with entries whose denormalized digest predates this field — those entries

            gain status on the next initiative update via natural digest propagation.'
          enum:
          - active
          - inactive
          nullable: true
        locale:
          type: string
          description: BCP-47 locale for this initiative (e.g. en-US, fr-CA)
          enum:
          - da-DK
          - de-DE
          - en-CA
          - en-GB
          - en-US
          - es-ES
          - es-MX
          - fi-FI
          - fr-CA
          - fr-FR
          - is-IS
          - it-IT
          - ko-KR
          - nl-NL
          - no-NO
          - pt-PT
          - sv-SE
          nullable: true
        name:
          type: string
          description: the name user has given this initiative
      required:
      - type
      - _id
      - billingType
      - unitIncrements
      - name
    UserInitiativeResponseDto:
      type: object
      properties:
        _id:
          type: string
          description: initiative's id
          format: objectid
        billingType:
          description: initiative's billing type
          enum:
          - billable
          - non-billable
          type: string
        callSign:
          type: string
          description: a short name or abbreviation that identifies this initiative
        createdAt:
          type: string
          description: date and time this initiative was created
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        customerId:
          type: string
          description: id of customer who owns this initiative
          format: objectid
        groupIds:
          description: list of group ids that have access to this initiative
          nullable: true
          type: array
          items:
            type: string
            format: objectid
        locale:
          type: string
          description: BCP-47 locale for this initiative (e.g. en-US, fr-CA)
          enum:
          - da-DK
          - de-DE
          - en-CA
          - en-GB
          - en-US
          - es-ES
          - es-MX
          - fi-FI
          - fr-CA
          - fr-FR
          - is-IS
          - it-IT
          - ko-KR
          - nl-NL
          - no-NO
          - pt-PT
          - sv-SE
          nullable: true
        status:
          description: initiative's status
          enum:
          - active
          - inactive
          type: string
        unitIncrements:
          type: number
          description: unit of billing increments for this initiative
          format: double
        updatedAt:
          type: string
          description: date and time this initiative was last updated
          example: '2022-08-12T20:44:48Z'
          format: iso-date-time
        type:
          description: initiative's type
          enum:
          - user
          type: string
        name:
          type: string
          description: a name that identifies this initiative for the user
        userId:
          type: string
          description: the userId of the user to whom this initiative belongs
          format: objectid
        isLaurelCreatedNotModifiable:
          type: boolean
          description: indicates this initiative was created by Laurel and cannot be modified or deleted except for unitIncrements
          nullable: true
      required:
      - _id
      - billingType
      - callSign
      - createdAt
      - customerId
      - status
      - unitIncrements
      - updatedAt
      - type
      - name
      - userId
    PmsInitiativeDto:
      type: object
      properties:
        _id:
