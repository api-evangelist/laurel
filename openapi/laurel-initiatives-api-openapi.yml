components:
  schemas:
    SetCustomerInitiativeAccessBatchDto:
      type: object
      properties:
        initiatives:
          type: array
          items:
            $ref: '#/components/schemas/InitiativeAccessDto'
      required:
      - initiatives
    Dto:
      type: object
      properties:
        externalId:
          type: string
          description: code's external id
        name:
          type: string
          description: code's name
        description:
          type: string
          description: code's description, can be empty
        codeTypeExternalId:
          type: string
          description: code's type's external id
        orderingSequence:
          type: string
          description: ordering sequence for UI sorting (alphanumeric)
          nullable: true
        group:
          type: string
          description: group identifier for categorizing codes
          nullable: true
        isDisabled:
          type: boolean
          description: whether the code is disabled, added from ingestion process
          nullable: true
      required:
      - externalId
      - name
      - description
      - codeTypeExternalId
    InitiativeAccessResponseDto:
      type: object
      properties:
        initiativeId:
          type: string
          description: Initiative's internal ID
          format: objectid
        initiativeExternalId:
          type: string
          description: Initiative's external ID from IntApp
        accessProviderName:
          type: string
          description: Provider of the access control
        type:
          description: Type of access control (Allow or Deny)
          enum:
          - allow
          - deny
          type: string
        users:
          description: List of users affected by the access rule
          type: array
          items:
            $ref: '#/components/schemas/UserAccessDto'
      required:
      - initiativeId
      - initiativeExternalId
      - accessProviderName
      - type
      - users
    SetCustomerInitiativeAccessWallsBatchDto:
      type: object
      properties:
        initiatives:
          type: array
          items:
            $ref: '#/components/schemas/InitiativeAccessWithWallsDto'
      required:
      - initiatives
    SetInitiativeInternalAccessRequestDto:
      type: object
      properties:
        type:
          description: type of access restriction
          enum:
          - allow
          - deny
          type: string
        userIds:
          description: list of users whose access is either allowed or denied for an initiative
          minItems: 1
          type: array
          items:
            type: string
            format: objectid
      required:
      - type
      - userIds
    GroupRestrictionsSummaryDto:
      type: object
      properties:
        groupCount:
          type: number
          description: Number of groups assigned to this initiative
          format: double
      required:
      - groupCount
    AccessRestrictionsSummaryDto:
      type: object
      properties:
        type:
          type: string
          description: The type of access restriction (allow or deny), null if not configured
          enum:
          - allow
          - deny
          nullable: true
        userCount:
          type: number
          description: Number of users on this restriction list
          format: double
      required:
      - userCount
    UserInitiativeListItemResponseDto:
      type: object
      properties:
        _id:
          type: string
          description: initiative's id
          format: objectid
        name:
          type: string
          description: a name that identifies this initiative for the user
        entryCount:
          type: number
          description: number of entries assigned to this initiative
          format: int64
          minimum: 0
        totalHours:
          type: number
          description: total hours across all entries assigned to this initiative
          format: double
        isLaurelCreatedNotModifiable:
          type: boolean
          description: when true, this initiative was created by Laurel (e.g. the "Not yet assigned" anonymous-timer placeholder) and clients should not offer rename or delete
      required:
      - _id
      - name
      - entryCount
      - totalHours
      - isLaurelCreatedNotModifiable
    AddInitiativeCodesRequestDto:
      type: object
      properties:
        codeExternalIds:
          minItems: 1
          maxItems: 2500
          type: array
          items:
            type: string
      required:
      - codeExternalIds
    ConsolidatedValidationSubDto:
      type: object
      properties:
        isRequiredCodeTypeExternalIdsEmpty:
          type: boolean
        requiredCodeTypeExternalIds:
          nullable: false
          type: array
          items:
            type: string
    InitiativeInternalGroupRestrictionsResponseDto:
      type: object
      properties:
        type:
          description: type of group restriction
          enum:
          - allow
          - deny
          type: string
        groups:
          description: list of groups whose access is allowed for the initiative
          type: array
          items:
            $ref: '#/components/schemas/GroupDetailsResponseDto'
      required:
      - type
      - groups
    GroupDetailsResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Group's internal ID
          format: objectid
        name:
          type: string
          description: Group's name
        externalId:
          type: string
          description: Group's external ID (for external system integration)
      required:
      - id
      - name
      - externalId
    ImportCustomerInitiativeDto:
      type: object
      properties:
        billingType:
          description: the billing type for this initiative
          enum:
          - billable
          - non-billable
          type: string
        externalId:
          type: string
          description: initiative's external id
        name:
          type: string
          description: a name that identifies this initiative
        description:
          type: string
          description: the description of the initiative
        callSign:
          type: string
          description: a short name or abbreviation that identifies this initiative
        clientExternalId:
          type: string
          description: external id of client this initiative belongs to
        externalGroupIds:
          description: list of external group ids that have access to this initiative
          nullable: true
          type: array
          items:
            type: string
        unitIncrements:
          type: number
          description: unit of billing increments for this initiative in seconds (36=0.01, 360=0.1, 900=0.25)
          format: double
        status:
          type: string
          description: initiative's status
          enum:
          - active
          - inactive
        locale:
          type: string
          description: BCP-47 locale for this initiative (e.g. en-US, fr-CA)
          enum:
          - da-DK
          - de-DE
          - en-CA
          - en-GB
          - en-US
          - es-ES
          - es-MX
          - fi-FI
          - fr-CA
          - fr-FR
          - is-IS
          - it-IT
          - ko-KR
          - nl-NL
          - no-NO
          - pt-PT
          - sv-SE
          nullable: true
        allowFrom:
          type: string
          description: earliest calendar date on which this initiative is valid for use (date-only, midnight UTC)
          example: '2022-08-12'
          format: iso-date
          nullable: true
        allowTo:
          type: string
          description: latest calendar date on which this initiative is valid for use, inclusive (date-only, midnight UTC)
          example: '2022-08-12'
          format: iso-date
          nullable: true
      required:
      - billingType
      - externalId
      - name
      - description
      - callSign
      - clientExternalId
      - unitIncrements
    Object:
      type: object
      properties: {}
    GroupMembershipDto:
      type: object
      properties:
        id:
          type: string
          description: Group's internal ID
          format: objectid
        externalId:
          type: string
          description: Group's external ID
        name:
          type: string
          description: Group's name
      required:
      - id
      - externalId
      - name
    InitiativeAccessRestrictionsResponseDto:
      type: object
      properties:
        access:
          description: Summary of external access restrictions (from PMS/Walls integration)
          allOf:
          - $ref: '#/components/schemas/AccessRestrictionsSummaryDto'
        internalAccessRestrictions:
          description: Summary of internal access restrictions (Laurel-managed)
          allOf:
          - $ref: '#/components/schemas/AccessRestrictionsSummaryDto'
        groups:
          description: Summary of external group configuration (from PMS import)
          allOf:
          - $ref: '#/components/schemas/GroupRestrictionsSummaryDto'
        internalGroupRestrictions:
          description: Summary of internal group restrictions (Laurel-managed)
          allOf:
          - $ref: '#/components/schemas/InternalGroupRestrictionsSummaryDto'
      required:
      - access
      - internalAccessRestrictions
      - groups
      - internalGroupRestrictions
    SetInitiativeInternalGroupRestrictionsRequestDto:
      type: object
      properties:
        type:
          type: string
          description: 'type of group restriction.

            Always allow-only by default (for now).'
          enum:
          - allow
        groupIds:
          description: list of groups whose access is allowed for an initiative
          minItems: 1
          type: array
          items:
            type: string
            format: objectid
      required:
      - type
      - groupIds
    SetCustomerInitiativeCodesDto:
      type: object
      properties:
        codeExternalIds:
          minItems: 1
          maxItems: 2500
          type: array
          items:
            type: string
      required:
      - codeExternalIds
    UpdateInternalAccessUsersRequestDto:
      type: object
      properties:
        userIds:
          description: list of user IDs to add **or** remove from the internal access restriction
          minItems: 1
          type: array
          items:
            type: string
            format: objectid
      required:
      - userIds
    SetCustomerInitiativeAccessDto:
      type: object
      properties:
        type:
          description: type of access.
          enum:
          - allow
          - deny
          type: string
        userIds:
          description: list of users whose access is either allowed or denied for an initiative.
          type: array
          items:
            type: string
            format: objectid
      required:
      - type
    InitiativeAccessWithWallsDto:
      type: object
      properties:
        initiativeExternalId:
          type: string
        access:
          $ref: '#/components/schemas/SetCustomerInitiativeAccessWallsDto'
      required:
      - initiativeExternalId
      - access
    UpdateInternalGroupsRequestDto:
      type: object
      properties:
        groupIds:
          description: list of group IDs to add or remove from the internal group restrictions
          minItems: 1
          type: array
          items:
            type: string
            format: objectid
      required:
      - groupIds
    InitiativeCodesDto:
      type: object
      properties:
        initiativeExternalId:
          type: string
        codes:
          $ref: '#/components/schemas/Dto'
      required:
      - initiativeExternalId
      - codes
    PmsInitiativeAdminResponseDto:
      type: object
      properties:
        _id:
          type: string
          description: initiative's id
          format: objectid
        billingType:
          description: initiative's billing type
          enum:
          - billable
          - non-billable
          type: string
        callSign:
          type: string
          description: a short name or abbreviation that identifies this initiative
        createdAt:
          type: string
          description: date and time this initiative was created
