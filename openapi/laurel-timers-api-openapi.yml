          $ref: '#/components/schemas/V3RunningTimerResponseDto'
        stopped:
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/V3StoppedTimerInfo'
      required:
      - result
      - started
      - stopped
    ValidationSuccessInfo:
      type: object
      properties:
        status:
          enum:
          - validation-success
          type: string
      required:
      - status
    ReleasePendingInfo:
      type: object
      properties:
        status:
          enum:
          - release-pending
