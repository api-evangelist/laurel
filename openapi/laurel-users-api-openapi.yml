      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      tags:
      - Users
      summary: Customer user controller update V2 v2
      x-summary-source: derived
  /api/v1/customers/{customerId}/users/{userId}/status:
    patch:
      operationId: CustomerUserController_updateStatus_v1
      parameters:
      - name: customerId
        required: true
        in: path
        description: customer's id
